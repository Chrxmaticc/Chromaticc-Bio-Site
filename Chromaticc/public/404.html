<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Chromaticc</title>
<link rel="icon" type="image/png" href="Chromaticc.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #000001;
  --surface: rgba(10, 10, 16, 0.72);
  --surface-2: rgba(18, 18, 26, 0.55);
  --border: rgba(255, 255, 255, 0.12);
  --border-strong: rgba(255, 255, 255, 0.35);
  --text: #ececf4;
  --text-muted: #8a8aa0;
  --text-dim: #56566a;
  --accent: #ffffff;
  --accent-2: #b0b0b0;
  --accent-glow: rgba(255, 255, 255, 0.4);
  --grid-line: rgba(255, 255, 255, 0.04);
  --transition: 0.2s ease;
}

[data-theme="light"] {
  --bg: #f4f2f5;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-2: rgba(245, 240, 244, 0.9);
  --border: rgba(0, 0, 0, 0.12);
  --border-strong: rgba(0, 0, 0, 0.35);
  --text: #0a0a0a;
  --text-muted: #6a6a80;
  --text-dim: #8a8aa0;
  --accent: #0a0a0a;
  --accent-2: #444444;
  --accent-glow: rgba(0, 0, 0, 0.3);
  --grid-line: rgba(0, 0, 0, 0.05);
}

html, body { height: 100%; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s, color 0.3s;
  position: relative;
}

/* ════════ GRID OVERLAYS ════════ */
.grid-overlay-fine,
.grid-overlay-medium,
.grid-overlay-coarse,
.grid-overlay-radial {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.grid-overlay-fine {
  z-index: -4;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 20px 20px;
}
.grid-overlay-medium {
  z-index: -3;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 60px 60px;
}
.grid-overlay-coarse {
  z-index: -2;
  background-image:
    linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 180px 180px;
}
.grid-overlay-radial {
  z-index: -1;
  background: radial-gradient(ellipse 70% 50% at 50% 40%, transparent 0%, var(--bg) 100%);
}

/* ════════ AMBIENT BLOBS ════════ */
body::before {
  content: '';
  position: fixed;
  top: -25%; left: 5%;
  width: 70vw; height: 70vw;
  background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
  filter: blur(120px);
  z-index: -5;
  pointer-events: none;
  animation: driftBlob 30s ease-in-out infinite;
}
body::after {
  content: '';
  position: fixed;
  bottom: -25%; right: 5%;
  width: 65vw; height: 65vw;
  background: radial-gradient(circle, rgba(192,192,192,0.06), transparent 60%);
  filter: blur(120px);
  z-index: -5;
  pointer-events: none;
  animation: driftBlob 40s ease-in-out infinite reverse;
}
@keyframes driftBlob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(5%, 5%) scale(1.15); }
}

/* ════════ LAYOUT ════════ */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 640px;
  width: 100%;
  padding: 40px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

/* ════════ DOCTOR ════════ */
.doctor-wrap {
  position: relative;
  width: clamp(140px, 32vw, 220px);
  height: clamp(140px, 32vw, 220px);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: floatDoctor 5s ease-in-out infinite;
}
.doctor-wrap::before {
  content: '';
  position: absolute;
  inset: -30%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow), transparent 65%);
  filter: blur(40px);
  opacity: 0.6;
  z-index: -1;
  animation: pulseGlow 4s ease-in-out infinite;
}
.doctor-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  filter: drop-shadow(0 0 30px rgba(255,255,255,0.25));
}
@keyframes floatDoctor {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-16px) rotate(2deg); }
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.08); }
}

/* ════════ 404 NUMBER ════════ */
.err-code {
  font-family: 'Orbitron', 'Inter', sans-serif;
  font-size: clamp(3rem, 9vw, 5rem);
  font-weight: 600;
  letter-spacing: 0.15em;
  line-height: 1;
  background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 5s ease infinite;
  filter: drop-shadow(0 0 24px var(--accent-glow));
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ════════ MESSAGE ════════ */
.message {
  font-size: clamp(0.95rem, 2vw, 1.15rem);
  font-weight: 500;
  color: var(--text);
  line-height: 1.7;
  max-width: 480px;
}
.message a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  border-bottom: 1px dashed var(--accent-2);
  padding-bottom: 1px;
  transition: var(--transition);
}
.message a:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 12px var(--accent-glow);
}
.message .chill {
  display: block;
  font-style: italic;
  color: var(--text-muted);
  margin-top: 10px;
  font-size: 0.92em;
  font-weight: 400;
}

/* ════════ BUTTONS ════════ */
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 22px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  border: 1px solid transparent;
  transition: var(--transition);
  font-family: inherit;
  text-decoration: none;
  letter-spacing: -0.2px;
}
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--bg);
  box-shadow: 0 0 22px var(--accent-glow);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px var(--accent-glow);
}
[data-theme="light"] .btn-primary { color: #ffffff; }
.btn-outline {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.btn-outline:hover {
  border-color: var(--border-strong);
  color: var(--accent);
  transform: translateY(-2px);
}
.btn-discord {
  background: #5865F2;
  color: #fff;
  border: none;
}
.btn-discord:hover {
  background: #4752C4;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(88,101,242,0.5);
}

/* ════════ FOOTER ════════ */
.tiny-footer {
  margin-top: 8px;
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.3px;
}
.tiny-footer a {
  color: var(--text-muted);
  text-decoration: none;
  transition: var(--transition);
}
.tiny-footer a:hover { color: var(--accent); }

/* ════════ RESPONSIVE ════════ */
@media (max-width: 480px) {
  .wrap { padding: 32px 18px; gap: 22px; }
  .btn { padding: 10px 18px; font-size: 0.8rem; }
  .actions { gap: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<!-- Grid overlays -->
<div class="grid-overlay-fine"></div>
<div class="grid-overlay-medium"></div>
<div class="grid-overlay-coarse"></div>
<div class="grid-overlay-radial"></div>

<main class="wrap">

  <!-- Doctor -->
  <div class="doctor-wrap">
    <img src="Chromaticc-Doctor.png" alt="Dr. Chromaticc">
  </div>

  <!-- 404 -->
  <h1 class="err-code">404</h1>

  <!-- Message -->
  <p class="message">
    Hey, you might've stumbled on something that doesn't exist,
    <a href="/discover">maybe a profile page?</a>
    <span class="chill">Chill with the doctor.</span>
  </p>

  <!-- Actions -->
  <div class="actions">
    <a href="/" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a2 2 0 01-2 2h-4v-7h-6v7H5a2 2 0 01-2-2z"/>
      </svg>
      Go Home
    </a>
    <a href="/discover" class="btn btn-outline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Browse Profiles
    </a>
    <a href="https://discord.gg/chrxmaticc" target="_blank" rel="noopener" class="btn btn-discord">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.79 19.79 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.3 12.3 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.84 19.84 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Join Discord
    </a>
  </div>

  <div class="tiny-footer">
    Chromaticc &copy; 2026 · <a href="/">chromaticc.creepers.lol</a>
  </div>

</main>

<script>
  // Follow system theme if the user has one saved on another page
  (function() {
    const saved = localStorage.getItem('chromaticc_theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();

  // Doctor reacts to cursor: slight parallax tilt
  (function() {
    const doctor = document.querySelector('.doctor-wrap');
    if (!doctor) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let raf = null;
    let tx = 0, ty = 0, cx = 0, cy = 0;

    window.addEventListener('mousemove', (e) => {
      tx = (e.clientX / window.innerWidth - 0.5) * 20;
      ty = (e.clientY / window.innerHeight - 0.5) * 20;
      if (!raf) raf = requestAnimationFrame(update);
    });

    function update() {
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      doctor.style.setProperty('--tilt-x', cx + 'px');
      doctor.style.setProperty('--tilt-y', cy + 'px');
      const img = doctor.querySelector('img');
      if (img) {
        img.style.transform = `translate(${cx}px, ${cy}px)`;
      }
      if (Math.abs(cx - tx) > 0.1 || Math.abs(cy - ty) > 0.1) {
        raf = requestAnimationFrame(update);
      } else {
        raf = null;
      }
    }
  })();
</script>
</body>
</html>
