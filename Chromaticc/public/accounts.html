<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromaticc — Sign in</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="Chromaticc.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
(function(){
  var s=localStorage.getItem('chromaticc_theme');
  var t=s||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --text:#ffffff;
  --muted:#8a8a9a;
  --muted-2:#4a4a58;
  --border:rgba(255,255,255,0.1);
  --border-strong:rgba(255,255,255,0.28);
  --glass:rgba(0,0,0,0.4);
  --glass-2:rgba(0,0,0,0.6);
  --icon:url('Chromaticc.png');
  --icon-blend:screen;
  --icon-filter:none;
}
html{scroll-behavior:smooth;}
body{
  min-height:100vh;
  background:#000;
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}
.bg-gif{position:fixed;inset:0;z-index:-5;pointer-events:none;background:url('background.gif') center/cover no-repeat;filter:brightness(0.55) saturate(0.7) contrast(1.05);}
.bg-vignette{position:fixed;inset:0;z-index:-4;pointer-events:none;background:radial-gradient(ellipse 100% 80% at 50% 40%,transparent 20%,rgba(0,0,0,0.5) 60%,rgba(0,0,0,0.85) 100%);}
.bg-scanlines{position:fixed;inset:0;z-index:-3;pointer-events:none;opacity:0.08;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.4) 0px,rgba(255,255,255,0.4) 1px,transparent 1px,transparent 3px);animation:scanDrift 12s linear infinite;mix-blend-mode:overlay;}
@keyframes scanDrift{to{background-position:0 3px;}}
.bg-grain{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0.07;background-image:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20200%20200%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.9%22%20numOctaves=%223%22/%3E%3C/filter%3E%3Crect%20width=%22200%22%20height=%22200%22%20filter=%22url(%23n)%22/%3E%3C/svg%3E");mix-blend-mode:overlay;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{max-width:100%;display:block;}

.nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;
  padding:14px 32px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-bottom:1px solid var(--border);
}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px;font-size:1.05rem;}
.nav-brand-icon{width:32px;height:32px;background-image:var(--icon);background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:var(--icon-blend);filter:var(--icon-filter) drop-shadow(0 0 12px rgba(255,255,255,0.5));}
.nav-spacer{flex:1;}
.nav-link{padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);transition:color .15s,background .15s;font-family:'JetBrains Mono',monospace;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}

.main{
  display:flex;justify-content:center;align-items:center;
  min-height:calc(100vh - 60px);padding:80px 20px;
  position:relative;z-index:2;
}
.card{
  width:100%;max-width:440px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(28px) saturate(1.4);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);
  border:1px solid var(--border);
  border-radius:24px;
  padding:44px 38px;
  box-shadow:0 40px 100px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
}
.card h1{
  font-size:1.9rem;font-weight:900;letter-spacing:-.8px;
  margin-bottom:6px;
  display:flex;align-items:center;gap:12px;
}
.card h1 .card-icon{width:36px;height:36px;background-image:var(--icon);background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:var(--icon-blend);filter:var(--icon-filter) drop-shadow(0 0 16px rgba(255,255,255,0.6));flex-shrink:0;}
.card p.sub{font-size:0.88rem;color:var(--muted);margin-bottom:28px;font-family:'JetBrains Mono',monospace;}

.banner{
  display:none;
  padding:12px 16px;border-radius:12px;
  font-size:0.82rem;line-height:1.5;margin-bottom:20px;
  font-family:'JetBrains Mono',monospace;
  border:1px solid;
}
.banner.show{display:block;}
.banner.err{background:rgba(176,0,32,0.15);border-color:rgba(255,80,110,0.4);color:#ff8899;}
.banner.ok{background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.35);color:#4ade80;}

.tab-row{display:flex;gap:0;margin-bottom:26px;border-bottom:1px solid var(--border);}
.tab{
  flex:1;text-align:center;padding:12px;
  color:var(--muted);font-weight:600;font-size:0.95rem;
  border-bottom:2px solid transparent;
  transition:all .2s;
  font-family:'JetBrains Mono',monospace;
}
.tab:hover{color:var(--text);}
.tab.active{color:#fff;border-bottom-color:#fff;}

.form{display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{
  font-size:0.68rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.14em;
  font-family:'JetBrains Mono',monospace;
}
.field input{
  padding:14px 16px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:#fff;
  font-size:0.95rem;
  font-family:inherit;
  outline:none;
  transition:all .2s;
}
.field input::placeholder{color:var(--muted-2);}
.field input:focus{
  border-color:var(--border-strong);
  background:rgba(255,255,255,0.06);
  box-shadow:0 0 0 3px rgba(255,255,255,0.06);
}

.btn-submit{
  margin-top:6px;
  padding:15px;
  border-radius:12px;
  background:#ffffff;
  color:#000;
  font-weight:800;
  font-size:0.95rem;
  font-family:inherit;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  overflow:hidden;
}
.btn-submit::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(0,0,0,0.15),transparent);transform:translateX(-100%);transition:transform .6s;}
.btn-submit:hover:not(:disabled)::before{transform:translateX(100%);}
.btn-submit:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 14px 40px rgba(255,255,255,0.3);}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;}

.err{color:#ff8899;font-size:0.82rem;min-height:18px;font-family:'JetBrains Mono',monospace;}

.reset-link{
  text-align:center;margin-top:20px;
  font-size:0.72rem;color:var(--muted-2);
  font-family:'JetBrains Mono',monospace;
}
.reset-link a{color:var(--muted);font-weight:600;text-decoration:underline;}
.reset-link a:hover{color:#fff;}

.footer-note{
  text-align:center;
  margin-top:26px;padding-top:22px;
  border-top:1px solid var(--border);
  font-size:0.72rem;color:var(--muted-2);
  font-family:'JetBrains Mono',monospace;
  line-height:1.6;
}
.footer-note a{color:var(--muted);text-decoration:underline;}
.footer-note a:hover{color:#fff;}

@media (max-width:520px){
  .nav{padding:12px 18px;}
  .main{padding:60px 16px;}
  .card{padding:32px 24px;border-radius:20px;}
  .card h1{font-size:1.5rem;}
}
</style>
</head>
<body>

<div class="bg-gif"></div>
<div class="bg-vignette"></div>
<div class="bg-scanlines"></div>
<div class="bg-grain"></div>

<nav class="nav">
  <a href="/" class="nav-brand">
    <div class="nav-brand-icon"></div>
    <span>Chromaticc</span>
  </a>
  <div class="nav-spacer"></div>
  <a href="/" class="nav-link">← back home</a>
</nav>

<main class="main">
  <div class="card">
    <h1><span class="card-icon"></span>Chromaticc</h1>
    <p class="sub">// sign in or create your page</p>

    <div class="banner" id="banner"></div>

    <div class="tab-row">
      <button class="tab active" id="tabLogin" type="button">log in</button>
      <button class="tab" id="tabSignup" type="button">sign up</button>
    </div>

    <form class="form" id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUsername">username or email</label>
        <input type="text" id="loginUsername" name="username" required autocomplete="username" spellcheck="false" autocapitalize="none">
      </div>
      <div class="field">
        <label for="loginPassword">password</label>
        <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">enter the chaos →</button>
      <div class="err" id="loginErr"></div>
    </form>

    <form class="form" id="signupForm" style="display:none;" autocomplete="on">
      <div class="field">
        <label for="signupUsername">username</label>
        <input type="text" id="signupUsername" name="username" required autocomplete="username" spellcheck="false" autocapitalize="none" placeholder="2-32 chars, letters/numbers/._-">
      </div>
      <div class="field">
        <label for="signupEmail">email</label>
        <input type="email" id="signupEmail" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signupPassword">password</label>
        <input type="password" id="signupPassword" name="password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="field">
        <label for="signupConfirm">confirm password</label>
        <input type="password" id="signupConfirm" name="confirm" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn-submit" id="signupBtn">join the goof troop →</button>
      <div class="err" id="signupErr"></div>
    </form>

    <div class="reset-link">
      session stuck? <a href="?force=1" id="forceResetLink">force reset →</a>
    </div>

    <div class="footer-note">
      <a href="https://discord.gg/chrxmaticc" target="_blank" rel="noopener">discord</a> ·
      <a href="/">home</a> ·
      <a href="#">terms</a>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';
const $ = (s,c) => (c||document).querySelector(s);
const root = document.documentElement;

const LOGIN_URL = '/api/login';
const SIGNUP_URL = '/api/signup';
const VERIFY_URL = '/api/verify';

const banner = $('#banner');
function showBanner(msg, type) {
  banner.textContent = msg;
  banner.className = 'banner show ' + (type === 'ok' ? 'ok' : 'err');
}
function clearToken() {
  localStorage.removeItem('chromaticc_token');
  localStorage.removeItem('chromaticc_user');
}
function saveSession(token, user) {
  clearToken();
  localStorage.setItem('chromaticc_token', token);
  localStorage.setItem('chromaticc_user', JSON.stringify(user));
}

/* Tab switching */
const tabLogin = $('#tabLogin'), tabSignup = $('#tabSignup');
const loginForm = $('#loginForm'), signupForm = $('#signupForm');
tabLogin.addEventListener('click', () => {
  tabLogin.classList.add('active'); tabSignup.classList.remove('active');
  loginForm.style.display = 'flex'; signupForm.style.display = 'none';
  banner.classList.remove('show');
});
tabSignup.addEventListener('click', () => {
  tabSignup.classList.add('active'); tabLogin.classList.remove('active');
  signupForm.style.display = 'flex'; loginForm.style.display = 'none';
  banner.classList.remove('show');
});

/* Existing-session check — verify against server, don't trust localStorage */
(async function checkExistingSession(){
  const params = new URLSearchParams(location.search);
  const force = params.has('force');

  if (force) {
    clearToken();
    // also clear cookie via server
    try { await fetch('/api/logout', { method: 'POST', credentials: 'include' }); } catch(e){}
    showBanner('// session cleared. log in again.', 'err');
    history.replaceState(null, '', location.pathname);
    return;
  }

  const token = localStorage.getItem('chromaticc_token');
  if (!token) return;

  try {
    const r = await fetch(VERIFY_URL, {
      headers: { 'Authorization': 'Bearer ' + token },
      credentials: 'include'
    });

    if (r.ok) {
      const data = await r.json();
      // refresh stored user in case it changed
      if (data.user) {
        localStorage.setItem('chromaticc_user', JSON.stringify(data.user));
      }
      window.location.href = '/dashboard.html';
      return;
    }

    // token is broken — clear it so user can log in
    clearToken();
    showBanner('// your old session expired. log in again.', 'err');
  } catch (e) {
    // network error — leave localStorage alone
  }
})();

/* Login */
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = $('#loginUsername').value.trim();
  const password = $('#loginPassword').value;
  const errEl = $('#loginErr');
  const btn = $('#loginBtn');
  errEl.textContent = '';

  if (!username || !password) { errEl.textContent = '// enter username and password'; return; }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'signing in…';

  try {
    const res = await fetch(LOGIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'include'
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Login failed');

    saveSession(data.token, data.user);
    showBanner('// welcome back. redirecting…', 'ok');
    setTimeout(() => { window.location.href = '/dashboard.html'; }, 300);
  } catch (err) {
    errEl.textContent = '// ' + err.message;
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

/* Signup */
signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = $('#signupUsername').value.trim();
  const email = $('#signupEmail').value.trim();
  const password = $('#signupPassword').value;
  const confirm = $('#signupConfirm').value;
  const errEl = $('#signupErr');
  const btn = $('#signupBtn');
  errEl.textContent = '';

  if (password !== confirm) { errEl.textContent = '// passwords do not match'; return; }
  if (password.length < 6) { errEl.textContent = '// password must be 6+ characters'; return; }
  if (!/^[a-zA-Z0-9_.-]{2,32}$/.test(username)) {
    errEl.textContent = '// username: 2-32 chars, letters/numbers/._- only';
    return;
  }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'creating page…';

  try {
    const res = await fetch(SIGNUP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password }),
      credentials: 'include'
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Signup failed');

    saveSession(data.token, data.user);
    showBanner('// page created. redirecting…', 'ok');
    setTimeout(() => { window.location.href = '/dashboard.html'; }, 300);
  } catch (err) {
    errEl.textContent = '// ' + err.message;
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

})();
</script>
</body>
</html>
