<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromaticc — Worldwide</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js and Globe.gl -->
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>

    <script>
        // Prevent theme flash on load
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>

    <style>
        :root[data-theme="dark"] {
            --bg: #000000;
            --text: #ffffff;
            --muted: #a1a1aa;
            --gradient-start: rgba(0,0,0,0);
            --gradient-end: #000000;
            --globe-glow: #062056;
        }

        :root[data-theme="light"] {
            --bg: #ffffff;
            --text: #09090b;
            --muted: #52525b;
            --gradient-start: rgba(255,255,255,0);
            --gradient-end: #ffffff;
            --globe-glow: #e4e4e7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* ── MAIN SECTION ── */
        .globe-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12vh;
        }

        /* ── ANIMATED TEXT ── */
        .text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 48rem;
            padding: 0 24px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .text-container h2 {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .text-container p {
            font-size: clamp(16px, 2vw, 18px);
            font-weight: 300;
            color: var(--muted);
            max-width: 32rem;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ── GLOBE CONTAINER ── */
        .globe-container {
            position: absolute;
            bottom: -10%;
            width: 100%;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }

        .globe-container:active {
            cursor: grabbing;
        }

        /* ── GRADIENT FADE ── */
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: linear-gradient(to bottom, var(--gradient-start), var(--gradient-end));
            z-index: 5;
            pointer-events: none;
        }

        /* ── THEME TOGGLE ── */
        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 50;
            background: transparent;
            border: 1px solid var(--muted);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: var(--text);
            color: var(--bg);
        }
        .fa-solid { font-size: 18px; }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>

    <div class="globe-section">
        <div class="text-container">
            <h2>Users worldwide.</h2>
            <p>Get it? Because we're worldwide.</p>
        </div>

        <div class="gradient-overlay"></div>
        <div class="globe-container" id="globeViz"></div>
    </div>

    <script>
        // ── 1. DATA ──
        const arcColors = ["#06b6d4", "#3b82f6", "#6366f1"];
        
        const userLocations = [
            { lat: 40.7128, lng: -74.0060, count: 14, city: "New York" },
            { lat: 51.5072, lng: -0.1276, count: 22, city: "London" },
            { lat: 35.6762, lng: 139.6503, count: 18, city: "Tokyo" },
            { lat: -33.8688, lng: 151.2093, count: 7, city: "Sydney" },
            { lat: 48.8566, lng: 2.3522, count: 11, city: "Paris" },
            { lat: 37.7749, lng: -122.4194, count: 9, city: "San Francisco" },
            { lat: 19.0760, lng: 72.8777, count: 15, city: "Mumbai" },
            { lat: -23.5505, lng: -46.6333, count: 8, city: "São Paulo" }
        ];

        const sampleArcs = [
            { startLat: 40.7128, startLng: -74.0060, endLat: 51.5072, endLng: -0.1276, arcAlt: 0.2, color: arcColors[0] },
            { startLat: 35.6762, startLng: 139.6503, endLat: 37.7749, endLng: -122.4194, arcAlt: 0.3, color: arcColors[1] },
            { startLat: 19.0760, startLng: 72.8777, endLat: -33.8688, endLng: 151.2093, arcAlt: 0.2, color: arcColors[2] },
            { startLat: 48.8566, startLng: 2.3522, endLat: 40.7128, endLng: -74.0060, arcAlt: 0.4, color: arcColors[0] }
        ];

        // ── 2. SETUP GLOBE ──
        let world;
        const globeEl = document.getElementById('globeViz');

        function initGlobe() {
            world = Globe()
                (globeEl)
                .backgroundColor('rgba(0,0,0,0)') // Transparent to show body bg
                .showAtmosphere(true)
                .atmosphereAltitude(0.2)
                
                // Set initial texture right here so it shows up instantly
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                
                // ── ARCS (Flight paths) ──
                .arcsData(sampleArcs)
                .arcStartLat(d => d.startLat)
                .arcStartLng(d => d.startLng)
                .arcEndLat(d => d.endLat)
                .arcEndLng(d => d.endLng)
                .arcColor(d => d.color)
                .arcAltitude(d => d.arcAlt)
                .arcDashLength(0.9)
                .arcDashGap(0.2)
                .arcDashAnimateTime(1500)
                .arcsTransitionDuration(0)

                // ── POINTS (The Dots) ──
                .pointsData(userLocations)
                .pointLat('lat')
                .pointLng('lng')
                .pointColor(() => '#38bdf8') // Cyan
                .pointAltitude(0.02) // Float slightly higher so they don't clip
                .pointRadius(d => Math.min(0.6, 0.15 + (d.count * 0.02))) 

                // ── RINGS (The Radar Pings) ──
                .ringsData(userLocations)
                .ringLat('lat')
                .ringLng('lng')
                .ringColor(() => t => `rgba(56, 189, 248, ${1 - t})`) // Cyan fade
                .ringMaxRadius(2.5)
                .ringPropagationSpeed(1.5)
                .ringRepeatPeriod(2000)

                // ── CONTROLS ──
                .enableZoom(false)
                .enablePan(false)
                .autoRotate(true)
                .autoRotateSpeed(0.6);

            // Apply Theme (Colors & Material)
            updateGlobeTheme();

            // Handle Resize
            window.addEventListener('resize', () => {
                world.width(globeEl.clientWidth);
                world.height(globeEl.clientHeight);
            });
            world.width(globeEl.clientWidth);
            world.height(globeEl.clientHeight);

            // Hover Tooltip
            world.onPointHover((point) => {
                if (point) {
                    globeEl.style.cursor = 'pointer';
                    globeEl.title = `${point.count} users active in ${point.city}`;
                } else {
                    globeEl.style.cursor = 'grab';
                    globeEl.title = '';
                }
            });
        }

        // ── 3. THEME LOGIC ──
        const root = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function updateGlobeTheme() {
            if (!world) return;
            const isDark = root.getAttribute('data-theme') === 'dark';
            
            // Swap Textures (Night City Lights vs Day Satellite)
            world.globeImageUrl(isDark 
                ? 'https://unpkg.com/three-globe/example/img/earth-night.jpg' 
                : 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
            );
            
            // Atmosphere
            world.atmosphereColor(isDark ? '#ffffff' : '#a1a1aa');
            
            // Material Tweaks
            const globeMaterial = world.globeMaterial();
            globeMaterial.color = new THREE.Color('#ffffff'); // White tint (multiplier)
            
            // If it's dark, give it a faint blue emissive glow so the dark side isn't pitch black
            globeMaterial.emissive = new THREE.Color(isDark ? '#062056' : '#000000');
            globeMaterial.emissiveIntensity = isDark ? 0.1 : 0;
            globeMaterial.shininess = 0.9;
            
            // Force material update to ensure texture renders
            globeMaterial.needsUpdate = true;
        }

        themeToggle.addEventListener('click', () => {
            const current = root.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            
            if (next === 'dark') {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
            
            updateGlobeTheme();
        });

        // Set initial icon state
        if (root.getAttribute('data-theme') === 'light') {
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // ── 4. BOOT ──
        window.addEventListener('DOMContentLoaded', () => {
            initGlobe();
        });
    </script>
</body>
</html>
