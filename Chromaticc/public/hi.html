<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromaticc — Ghost Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #09090b;
            --text: #ffffff;
            --muted: #a1a1aa;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow-y: auto;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        /* ── THE GHOST CANVAS ── */
        .canvas {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        /* Empty state prompt */
        .empty-prompt {
            color: var(--muted);
            font-size: 15px;
            font-style: italic;
            opacity: 0.5;
            cursor: text;
        }

        /* ── WIDGETS ── */
        .widget {
            position: relative;
            border-radius: 12px;
            transition: all 0.2s var(--ease);
            padding: 4px;
            outline: 1px solid transparent;
            cursor: grab;
        }

        .widget:hover {
            background: var(--surface);
            outline: 1px solid var(--border);
        }

        /* The Drag Handle (Appears on hover) */
        .drag-handle {
            position: absolute;
            left: -32px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            opacity: 0;
            cursor: grab;
            padding: 8px;
            transition: opacity 0.2s;
        }
        .widget:hover .drag-handle { opacity: 1; }

        /* ── ACTUAL WIDGET STYLES ── */
        .w-profile { display: flex; align-items: center; gap: 16px; padding: 16px 0; }
        .w-avatar { width: 64px; height: 64px; border-radius: 50%; background: #333; border: 2px solid var(--border); }
        .w-name { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; outline: none; }
        .w-bio { font-size: 14px; color: var(--muted); outline: none; }

        .w-link { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: #111; border: 1px solid var(--border);
            border-radius: 10px; text-decoration: none; color: var(--text);
            font-size: 14px; font-weight: 500; transition: background 0.2s;
            cursor: pointer;
        }
        .w-link:hover { background: #18181b; }

        /* ── THE FLOATING TOOLBAR ── */
        .toolbar {
            position: absolute;
            top: -45px;
            left: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(20, 20, 22, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transform: translateY(5px) scale(0.95);
            transition: all 0.2s var(--ease);
            z-index: 100;
        }
        
        .widget:hover .toolbar, .widget:focus-within .toolbar {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            width: 28px; height: 28px;
            border-radius: 4px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .toolbar-btn.delete:hover { color: #ef4444; }
        .toolbar-divider { width: 1px; height: 14px; background: var(--border); margin: 0 4px; }

        /* ── THE SLASH MENU ── */
        .slash-menu {
            position: absolute;
            width: 280px;
            background: rgba(18, 18, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            padding: 6px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 2px;
        }
        .slash-menu.active { display: flex; }

        .slash-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 6px;
            color: var(--muted); font-size: 13px; cursor: pointer;
            transition: all 0.15s;
        }
        .slash-item:hover, .slash-item.active {
            background: rgba(255,255,255,0.08); color: var(--text);
        }
        .slash-item i { width: 16px; text-align: center; }

        /* ── STATUS BAR ── */
        .status-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 22, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--muted);
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    </style>
</head>
<body>

    <div class="canvas" id="canvas">
        <!-- Widgets will spawn here -->
        <div class="empty-prompt" id="emptyPrompt">Type / to add a widget...</div>
    </div>

    <!-- Slash Menu (Hidden by default) -->
    <div class="slash-menu" id="slashMenu">
        <div class="slash-item" data-type="profile"><i class="fa-solid fa-user"></i> Profile Card</div>
        <div class="slash-item" data-type="link"><i class="fa-solid fa-link"></i> Link Button</div>
        <div class="slash-item" data-type="text"><i class="fa-solid fa-font"></i> Text Block</div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-dot"></div>
        <span id="statusText">All changes saved</span>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const slashMenu = document.getElementById('slashMenu');
        const emptyPrompt = document.getElementById('emptyPrompt');
        const statusText = document.getElementById('statusText');
        let widgetCount = 0;

        // ── 1. SHOW SLASH MENU ──
        document.addEventListener('keydown', (e) => {
            // If user types '/', show menu at center of screen
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && !document.activeElement.isContentEditable) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                // Position menu roughly in the middle of the canvas
                slashMenu.style.top = (window.scrollY + 200) + 'px';
                slashMenu.style.left = '50%';
                slashMenu.style.transform = 'translateX(-50%)';
                slashMenu.classList.add('active');
            }
            if (e.key === 'Escape') {
                slashMenu.classList.remove('active');
            }
        });

        // Click outside to close menu
        document.addEventListener('click', (e) => {
            if (!slashMenu.contains(e.target) && e.target.id !== 'emptyPrompt') {
                slashMenu.classList.remove('active');
            }
        });

        // ── 2. CREATE WIDGETS ──
        document.querySelectorAll('.slash-item').forEach(item => {
            item.addEventListener('click', () => {
                const type = item.dataset.type;
                addWidget(type);
                slashMenu.classList.remove('active');
            });
        });

        function addWidget(type) {
            emptyPrompt.style.display = 'none';
            widgetCount++;

            const widget = document.createElement('div');
            widget.className = 'widget';
            
            // The floating toolbar HTML (Shared across all widgets)
            const toolbarHTML = `
                <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
                <div class="toolbar">
                    <button class="toolbar-btn"><i class="fa-solid fa-palette"></i></button>
                    <button class="toolbar-btn"><i class="fa-solid fa-sliders"></i></button>
                    <div class="toolbar-divider"></div>
                    <button class="toolbar-btn delete" onclick="this.closest('.widget').remove()"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;

            if (type === 'profile') {
                widget.innerHTML = `
                    ${toolbarHTML}
                    <div class="w-profile">
                        <div class="w-avatar"></div>
                        <div>
                            <div class="w-name" contenteditable="true">Alex</div>
                            <div class="w-bio" contenteditable="true">Designer & Builder</div>
                        </div>
                    </div>
                `;
            } else if (type === 'link') {
                widget.innerHTML = `
                    ${toolbarHTML}
                    <div class="w-link">
                        <span contenteditable="true">My Portfolio</span>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="color:var(--muted); font-size:12px;"></i>
                    </div>
                `;
            } else if (type === 'text') {
                widget.innerHTML = `
                    ${toolbarHTML}
                    <div style="font-size:16px; padding: 8px 0; outline:none;" contenteditable="true">Type something...</div>
                `;
            }

            canvas.appendChild(widget);
            saveMock();
        }

        // ── 3. INLINE EDITING & SAVING ──
        // Every time a user types in an editable field, show "Saving..."
        canvas.addEventListener('input', (e) => {
            if (e.target.isContentEditable) {
                saveMock();
            }
        });

        function saveMock() {
            statusText.textContent = 'Saving...';
            statusText.parentElement.style.color = '#fbbf24'; // Yellow
            
            clearTimeout(window.saveTimeout);
            window.saveTimeout = setTimeout(() => {
                statusText.textContent = 'All changes saved';
                statusText.parentElement.style.color = 'var(--muted)';
            }, 800);
        }
    </script>
</body>
</html>
