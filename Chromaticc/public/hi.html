<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chromaticc — Canvas Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

    <style>
        :root {
            --bg: #09090b;
            --surface: #121214;
            --surface-hover: #18181b;
            --border: #27272a;
            --text: #ffffff;
            --muted: #a1a1aa;
            --accent: #38bdf8;
            --font: 'Poppins', sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* ── MAIN CANVAS AREA ── */
        .workspace {
            flex: 1;
            position: relative;
            overflow: auto;
            background-image: 
                radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
            background-size: 40px 40px;
            cursor: default;
            transition: padding-right 0.3s var(--ease);
        }

        .workspace.settings-open { padding-right: 320px; }

        /* The actual infinite page */
        .page {
            position: relative;
            width: 2000px;
            height: 2000px;
            /* Center it roughly */
            margin: 100px auto;
        }

        /* ── WIDGETS ── */
        .widget {
            position: absolute;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: default;
            touch-action: none; /* Crucial for interact.js */
            transition: border-color 0.1s, box-shadow 0.1s;
        }

        /* Only show outline on hover */
        .widget:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Selected state */
        .widget.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        /* Drag handle (the whole widget is draggable, but we show a grab cursor) */
        .widget:not(.selected) { cursor: grab; }
        .widget:not(.selected):active { cursor: grabbing; }

        /* Resize Handle */
        .resize-handle {
            position: absolute;
            right: -5px;
            bottom: -5px;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border: 2px solid var(--bg);
            border-radius: 50%;
            opacity: 0;
            cursor: se-resize;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .widget.selected .resize-handle { opacity: 1; }

        /* Toolbar */
        .widget-toolbar {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .widget.selected .widget-toolbar {
            opacity: 1;
            pointer-events: auto;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            width: 26px; height: 26px;
            border-radius: 4px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: var(--surface-hover); color: var(--text); }
        .tool-btn.delete:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        /* ── EDITABLE CONTENT ── */
        [contenteditable] {
            outline: none;
            cursor: text;
            padding: 4px;
            min-width: 20px;
            border-radius: 4px;
        }
        [contenteditable]:focus {
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 1px var(--border);
        }
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: var(--muted);
            pointer-events: none;
        }

        /* ── SPECIFIC WIDGETS ── */
        .w-text { font-size: 18px; line-height: 1.5; width: 100%; height: 100%; }
        .w-link { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 100%; height: 100%; text-decoration: none; color: var(--text); }
        .w-profile { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; height: 100%; }
        .w-avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
        .w-name { font-size: 20px; font-weight: 600; }
        .w-bio { font-size: 14px; color: var(--muted); }

        /* ── RIGHT SETTINGS PANEL ── */
        .settings-panel {
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            position: fixed;
            top: 0; right: 0; bottom: 0;
            transform: translateX(100%);
            transition: transform 0.3s var(--ease);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .settings-panel.open { transform: translateX(0); }

        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border-bottom: 1px solid var(--border);
        }
        .settings-header h2 { font-size: 15px; font-weight: 600; }
        .close-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        .close-btn:hover { color: var(--text); }

        .settings-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex; flex-direction: column; gap: 16px;
        }

        .setting-group { display: flex; flex-direction: column; gap: 6px; }
        .setting-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); }
        .setting-row { display: flex; gap: 10px; }
        .setting-row > div { flex: 1; }
        
        .setting-group input, .setting-group textarea {
            width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg); font-family: var(--font); font-size: 13px; color: var(--text);
            outline: none;
        }
        .setting-group input:focus, .setting-group textarea:focus { border-color: var(--accent); }

        /* ── SLASH MENU ── */
        .slash-menu {
            position: fixed;
            width: 220px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            padding: 6px;
            z-index: 2000;
            display: none;
            flex-direction: column; gap: 2px;
        }
        .slash-menu.active { display: flex; animation: popIn 0.15s var(--ease); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(-5px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .slash-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer;
        }
        .slash-item:hover, .slash-item.active { background: var(--surface-hover); }
        .slash-item i { width: 16px; text-align: center; color: var(--muted); }

        /* ── DOCK ── */
        .dock-wrapper {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 900; display: flex; align-items: center; gap: 8px;
        }
        .dock {
            display: flex; align-items: center; background: var(--surface);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .dock-btn {
            background: transparent; border: none; color: var(--muted);
            width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; font-size: 15px;
        }
        .dock-btn:hover { background: var(--surface-hover); color: var(--text); }
        
        .dock-scroll {
            display: flex; gap: 4px; overflow-x: auto; max-width: 250px; scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .dock-scroll::-webkit-scrollbar { display: none; }

    </style>
</head>
<body>

    <!-- Main Canvas -->
    <div class="workspace" id="workspace">
        <div class="page" id="page">
            <!-- Widgets go here -->
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2 id="settingsTitle">Widget Settings</h2>
            <button class="close-btn" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="settings-body" id="settingsBody">
            <!-- Dynamic -->
        </div>
    </div>

    <!-- Slash Menu -->
    <div class="slash-menu" id="slashMenu">
        <div id="slashList"></div>
    </div>

    <!-- Bottom Dock -->
    <div class="dock-wrapper">
        <div class="dock">
            <button class="dock-btn" onclick="scrollDock(-100)"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="dock-scroll" id="dockScroll">
                <!-- Widget buttons -->
            </div>
            <button class="dock-btn" onclick="scrollDock(100)"><i class="fa-solid fa-chevron-right"></i></button>
            <div style="width:1px; height:20px; background:var(--border); margin:0 4px;"></div>
            <button class="dock-btn" onclick="saveLayout()" style="color:var(--accent);"><i class="fa-solid fa-cloud-arrow-up"></i></button>
        </div>
    </div>

    <script>
        const WIDGET_TYPES = [
            { type: 'text', name: 'Text', icon: 'fa-font' },
            { type: 'profile', name: 'Profile', icon: 'fa-user' },
            { type: 'link', name: 'Link', icon: 'fa-link' },
            { type: 'image', name: 'Image', icon: 'fa-image' }
        ];

        let layout = [];
        let selectedId = null;
        let snapGrid = 20; // Snap to 20px grid

        // ── INIT ──
        function init() {
            buildDock();
            buildSlashMenu();

            const saved = localStorage.getItem('chroma_pro_canvas');
            if (saved) {
                layout = JSON.parse(saved);
            } else {
                // Default layout
                layout = [
                    { id: '1', type: 'profile', x: 400, y: 200, w: 320, h: 100, data: { name: 'Alex', bio: 'Designer & Builder' } },
                    { id: '2', type: 'link', x: 400, y: 320, w: 320, h: 60, data: { label: 'My Portfolio', url: '#' } }
                ];
            }
            renderAll();
        }

        function generateId() { return Math.random().toString(36).substr(2, 9); }

        // ── RENDER (Only runs once on load, then we update DOM directly) ──
        function renderAll() {
            const page = document.getElementById('page');
            page.innerHTML = ''; // Clear

            layout.forEach(block => {
                createWidgetDOM(block);
            });
        }

        function createWidgetDOM(block) {
            const page = document.getElementById('page');
            const el = document.createElement('div');
            el.className = 'widget';
            el.id = `widget-${block.id}`;
            el.dataset.id = block.id;

            // Set position & size
            el.style.left = `${block.x}px`;
            el.style.top = `${block.y}px`;
            el.style.width = `${block.w}px`;
            el.style.height = `${block.h}px`;

            // Content and Toolbar
            el.innerHTML = `
                <div class="widget-toolbar">
                    <button class="tool-btn" onclick="openSettings('${block.id}')"><i class="fa-solid fa-sliders"></i></button>
                    <button class="tool-btn delete" onclick="deleteWidget('${block.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="resize-handle"></div>
                <div class="w-content" style="width:100%; height:100%;">
                    ${getWidgetHTML(block)}
                </div>
            `;

            page.appendChild(el);

            // Make it draggable/resizable
            makeInteractable(el, block);

            // Click to select
            el.addEventListener('mousedown', (e) => {
                // Only select if we aren't clicking a button, handle, or contenteditable
                if (!e.target.closest('.widget-toolbar') && !e.target.closest('.resize-handle') && !e.target.isContentEditable) {
                    selectWidget(block.id);
                }
            });
        }

        // ── HTML GENERATOR ──
        function getWidgetHTML(block) {
            const d = block.data;
            const update = (field) => `oninput="updateData('${block.id}', '${field}', this.innerText)"`;

            switch (block.type) {
                case 'text':
                    return `<div class="w-text" contenteditable="true" data-placeholder="Type something..." ${update('text')}>${d.text || ''}</div>`;
                case 'profile':
                    return `<div class="w-profile">
                        <div class="w-avatar" style="background-image:url(${d.avatar || 'https://api.dicebear.com/7.x/initials/svg?seed=' + (d.name || 'A')}); background-size:cover;"></div>
                        <div>
                            <div class="w-name" ${update('name')} contenteditable="true">${d.name || 'Your Name'}</div>
                            <div class="w-bio" ${update('bio')} contenteditable="true">${d.bio || 'Your bio'}</div>
                        </div>
                    </div>`;
                case 'link':
                    return `<a class="w-link" href="${d.url || '#'}" onclick="event.preventDefault()">
                        <span ${update('label')} contenteditable="true" style="font-weight:500;">${d.label || 'New Link'}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="color:var(--muted); font-size:12px;"></i>
                    </a>`;
                case 'image':
                    return `<div class="w-image" style="width:100%; height:100%; border-radius:8px; overflow:hidden;">
                        <img src="${d.url || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop'}" style="width:100%; height:100%; object-fit:cover;">
                    </div>`;
                default: return '';
            }
        }

        // ── INTERACT.JS (THE MAGIC) ──
        function makeInteractable(el, block) {
            interact(el)
                .draggable({
                    ignoreFrom: '.widget-toolbar, .resize-handle, [contenteditable]',
                    inertia: true,
                    modifiers: [
                        interact.modifiers.snap({
                            targets: [interact.snappers.grid({ x: snapGrid, y: snapGrid })],
                            range: Infinity,
                            relativePoints: [ { x: 0, y: 0 } ]
                        }),
                        interact.modifiers.restrictRect({
                            restriction: 'parent',
                            endOnly: false
                        })
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            
                            // Calculate new position based on starting position + drag delta
                            let newX = block.x + event.dx;
                            let newY = block.y + event.dy;

                            // Apply visually via transform for buttery smoothness
                            target.style.transform = `translate(${newX - block.x}px, ${newY - block.y}px)`;

                            // Live-update the settings panel if it's open
                            if (selectedId === block.id) {
                                const xInput = document.getElementById('s-x');
                                const yInput = document.getElementById('s-y');
                                if(xInput) xInput.value = Math.round(newX);
                                if(yInput) yInput.value = Math.round(newY);
                            }
                        },
                        end(event) {
                            const target = event.target;
                            
                            // Commit the final position to state
                            block.x = Math.round((block.x + event.dx) / snapGrid) * snapGrid;
                            block.y = Math.round((block.y + event.dy) / snapGrid) * snapGrid;

                            // Reset transform and apply absolute left/top
                            target.style.transform = 'none';
                            target.style.left = `${block.x}px`;
                            target.style.top = `${block.y}px`;

                            saveLayout();
                        }
                    }
                })
                .resizable({
                    edges: { right: '.resize-handle', bottom: '.resize-handle' },
                    listeners: {
                        move(event) {
                            const target = event.target;
                            
                            // Apply new size visually
                            target.style.width = `${event.rect.width}px`;
                            target.style.height = `${event.rect.height}px`;
                            
                            // Live-update the settings panel
                            if (selectedId === block.id) {
                                const wInput = document.getElementById('s-w');
                                const hInput = document.getElementById('s-h');
                                if(wInput) wInput.value = Math.round(event.rect.width);
                                if(hInput) hInput.value = Math.round(event.rect.height);
                            }
                        },
                        end(event) {
                            // Commit final size to state
                            block.w = event.rect.width;
                            block.h = event.rect.height;
                            saveLayout();
                        }
                    },
                    modifiers: [
                        interact.modifiers.restrictSize({
                            min: { width: 50, height: 30 }
                        })
                    ]
                });
        }

        // ── SPAWNING WIDGETS ──
        function spawnWidget(type, x, y) {
            const defaultSize = type === 'profile' ? { w: 320, h: 100 } : type === 'link' ? { w: 320, h: 60 } : { w: 200, h: 50 };
            
            const newBlock = {
                id: generateId(),
                type: type,
                x: Math.max(0, x), 
                y: Math.max(0, y),
                w: defaultSize.w,
                h: defaultSize.h,
                data: getDefaultData(type)
            };

            layout.push(newBlock);
            createWidgetDOM(newBlock);
            selectWidget(newBlock.id);
            saveLayout();
            
            // Focus text if it's a text block
            if (type === 'text') {
                setTimeout(() => {
                    const el = document.querySelector(`#widget-${newBlock.id} [contenteditable]`);
                    if (el) el.focus();
                }, 50);
            }
        }

        function getDefaultData(type) {
            switch(type) {
                case 'text': return { text: '' };
                case 'profile': return { name: 'Your Name', bio: 'Your bio' };
                case 'link': return { label: 'New Link', url: '#' };
                case 'image': return { url: '' };
                default: return {};
            }
        }

        // Double click workspace to spawn
        document.getElementById('workspace').addEventListener('dblclick', (e) => {
            if (e.target.id === 'workspace' || e.target.id === 'page') {
                const page = document.getElementById('page');
                const rect = page.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                spawnWidget('text', x, y);
            }
        });

        // Click workspace to deselect
        document.getElementById('workspace').addEventListener('mousedown', (e) => {
            if (e.target.id === 'workspace' || e.target.id === 'page') {
                selectWidget(null); // Deselect
            }
        });

        // ── SLASH MENU ──
        function buildSlashMenu() {
            const list = document.getElementById('slashList');
            list.innerHTML = WIDGET_TYPES.map(w => `
                <div class="slash-item" data-type="${w.type}">
                    <i class="fa-solid ${w.icon}"></i> ${w.name}
                </div>
            `).join('');

            list.querySelectorAll('.slash-item').forEach(item => {
                item.onclick = () => {
                    spawnWidget(item.dataset.type, window.slashX, window.slashY);
                    closeSlashMenu();
                };
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && !e.target.closest('.slash-menu')) {
                if (!e.target.isContentEditable && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    
                    const page = document.getElementById('page');
                    const rect = page.getBoundingClientRect();
                    
                    // Get mouse pos relative to page
                    window.slashX = Math.round((window.lastMouseX - rect.left) / snapGrid) * snapGrid;
                    window.slashY = Math.round((window.lastMouseY - rect.top) / snapGrid) * snapGrid;
                    
                    const menu = document.getElementById('slashMenu');
                    menu.style.left = `${window.lastMouseX}px`;
                    menu.style.top = `${window.lastMouseY + 20}px`;
                    menu.classList.add('active');
                }
            }
            if (e.key === 'Escape') {
                closeSlashMenu();
                selectWidget(null);
            }
        });

        // Track mouse for slash command
        window.addEventListener('mousemove', (e) => {
            window.lastMouseX = e.clientX;
            window.lastMouseY = e.clientY;
        });

        function closeSlashMenu() {
            document.getElementById('slashMenu').classList.remove('active');
        }

        // ── SETTINGS PANEL ──
        function selectWidget(id) {
            selectedId = id;
            
            // Remove selected class from all
            document.querySelectorAll('.widget').forEach(w => w.classList.remove('selected'));
            
            if (id) {
                const el = document.getElementById(`widget-${id}`);
                if (el) el.classList.add('selected');
                openSettings(id);
            } else {
                closeSettings();
            }
        }

        function openSettings(id) {
            const block = layout.find(b => b.id === id);
            if(!block) return;

            document.getElementById('workspace').classList.add('settings-open');
            document.getElementById('settingsPanel').classList.add('open');
            document.getElementById('settingsTitle').innerText = `Edit ${block.type.toUpperCase()}`;
            
            const body = document.getElementById('settingsBody');
            body.innerHTML = `
                <div class="setting-row">
                    <div class="setting-group"><label>X Pos</label><input type="number" id="s-x" value="${Math.round(block.x)}" onchange="changeProp('${id}', 'x', this.value)"></div>
                    <div class="setting-group"><label>Y Pos</label><input type="number" id="s-y" value="${Math.round(block.y)}" onchange="changeProp('${id}', 'y', this.value)"></div>
                </div>
                <div class="setting-row">
                    <div class="setting-group"><label>Width</label><input type="number" id="s-w" value="${Math.round(block.w)}" onchange="changeProp('${id}', 'w', this.value)"></div>
                    <div class="setting-group"><label>Height</label><input type="number" id="s-h" value="${Math.round(block.h)}" onchange="changeProp('${id}', 'h', this.value)"></div>
                </div>
                <hr style="border:none; border-top:1px solid var(--border); margin: 10px 0;">
            `;

            // Append specific fields
            if (block.type === 'text') {
                body.innerHTML += `<div class="setting-group"><label>Content</label><textarea rows="4" oninput="updateData('${id}', 'text', this.value)">${block.data.text || ''}</textarea></div>`;
            } else if (block.type === 'profile') {
                body.innerHTML += `
                    <div class="setting-group"><label>Name</label><input type="text" value="${block.data.name || ''}" oninput="updateData('${id}', 'name', this.value)"></div>
                    <div class="setting-group"><label>Bio</label><input type="text" value="${block.data.bio || ''}" oninput="updateData('${id}', 'bio', this.value)"></div>
                    <div class="setting-group"><label>Avatar URL</label><input type="text" value="${block.data.avatar || ''}" oninput="updateData('${id}', 'avatar', this.value)"></div>
                `;
            } else if (block.type === 'link') {
                body.innerHTML += `
                    <div class="setting-group"><label>Label</label><input type="text" value="${block.data.label || ''}" oninput="updateData('${id}', 'label', this.value)"></div>
                    <div class="setting-group"><label>URL</label><input type="text" value="${block.data.url || ''}" oninput="updateData('${id}', 'url', this.value)"></div>
                `;
            } else if (block.type === 'image') {
                body.innerHTML += `<div class="setting-group"><label>Image URL</label><input type="text" value="${block.data.url || ''}" oninput="updateData('${id}', 'url', this.value)"></div>`;
            }
        }

        function closeSettings() {
            document.getElementById('workspace').classList.remove('settings-open');
            document.getElementById('settingsPanel').classList.remove('open');
            selectedId = null;
        }

        function changeProp(id, prop, val) {
            const block = layout.find(b => b.id === id);
            if(block) {
                block[prop] = parseFloat(val);
                const el = document.getElementById(`widget-${id}`);
                if(el) {
                    if(prop === 'x') el.style.left = `${val}px`;
                    if(prop === 'y') el.style.top = `${val}px`;
                    if(prop === 'w') el.style.width = `${val}px`;
                    if(prop === 'h') el.style.height = `${val}px`;
                }
                saveLayout();
            }
        }

        function updateData(id, field, value) {
            const block = layout.find(b => b.id === id);
            if (block) {
                block.data[field] = value;
                saveLayout();
                
                // Live update DOM
                const el = document.querySelector(`#widget-${id}`);
                if (el) {
                    if (field === 'text') el.querySelector('[contenteditable]').innerText = value;
                    if (field === 'name') el.querySelector('.w-name').innerText = value;
                    if (field === 'bio') el.querySelector('.w-bio').innerText = value;
                    if (field === 'label') el.querySelector('.w-link span').innerText = value;
                    if (field === 'avatar') el.querySelector('.w-avatar').style.backgroundImage = `url(${value})`;
                    if (field === 'url' && block.type === 'link') el.querySelector('a').href = value;
                    if (field === 'url' && block.type === 'image') el.querySelector('img').src = value;
                }
            }
        }

        function deleteWidget(id) {
            layout = layout.filter(b => b.id !== id);
            const el = document.getElementById(`widget-${id}`);
            if (el) el.remove();
            saveLayout();
            closeSettings();
        }

        // ── DOCK ──
        function buildDock() {
            const scroll = document.getElementById('dockScroll');
            WIDGET_TYPES.forEach(w => {
                const btn = document.createElement('button');
                btn.className = 'dock-btn';
                btn.innerHTML = `<i class="fa-solid ${w.icon}"></i>`;
                btn.title = w.name;
                btn.onclick = () => {
                    // Spawn in center of the visible workspace
                    const workspace = document.getElementById('workspace');
                    const x = workspace.scrollLeft + (workspace.clientWidth / 2) - 100;
                    const y = workspace.scrollTop + (workspace.clientHeight / 2) - 50;
                    spawnWidget(w.type, x, y);
                };
                scroll.appendChild(btn);
            });
        }

        function scrollDock(amount) {
            document.getElementById('dockScroll').scrollBy({ left: amount, behavior: 'smooth' });
        }

        // ── SAVE ──
        function saveLayout() {
            localStorage.setItem('chroma_pro_canvas', JSON.stringify(layout));
        }

        // Start
        init();
    </script>
</body>
</html>
