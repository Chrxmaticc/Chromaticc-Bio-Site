<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromaticc — Worldwide</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Globe.gl and Three.js CDN -->
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>

    <script>
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>

    <style>
        :root[data-theme="dark"] {
            --bg: #000000;
            --text: #ffffff;
            --muted: #a1a1aa;
            --globe-color: #09090b;
            --atmosphere: #ffffff;
            --arc-color: #ffffff;
            --gradient-start: rgba(0,0,0,0);
            --gradient-end: #000000;
        }

        :root[data-theme="light"] {
            --bg: #ffffff;
            --text: #09090b;
            --muted: #52525b;
            --globe-color: #f4f4f5;
            --atmosphere: #09090b;
            --arc-color: #09090b;
            --gradient-start: rgba(255,255,255,0);
            --gradient-end: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Prevent scrolling for this specific section */
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ── MAIN SECTION ── */
        .globe-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 15vh;
            overflow: hidden;
        }

        /* ── ANIMATED TEXT (Framer Motion equivalent) ── */
        .text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 48rem; /* max-w-3xl */
            padding: 0 16px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .text-container h2 {
            font-size: clamp(24px, 4vw, 36px); /* md:text-4xl */
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .text-container p {
            font-size: clamp(16px, 2vw, 18px); /* md:text-lg */
            font-weight: 400;
            color: var(--muted);
            max-width: 28rem;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ── THE GLOBE CONTAINER ── */
        .globe-container {
            position: absolute;
            bottom: -20%; /* Offset to show top half of globe */
            width: 100%;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }

        .globe-container:active {
            cursor: grabbing;
        }

        /* ── GRADIENT FADE OVERLAY ── */
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px; /* h-40 */
            background: linear-gradient(to bottom, var(--gradient-start), var(--gradient-end));
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to the globe */
        }

        /* ── THEME TOGGLE BUTTON ── */
        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 50;
            background: transparent;
            border: 1px solid var(--muted);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: var(--text);
            color: var(--bg);
        }

        /* Utility for Font Awesome icons */
        .fa-solid { font-size: 18px; }
    </style>
    <!-- Font Awesome for the toggle icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>

    <div class="globe-section">
        <div class="text-container">
            <h2>Your whole internet. Worldwide.</h2>
            <p>This globe is interactive and customizable. Have fun with it, and don't forget to share it. :)</p>
        </div>

        <!-- Gradient fade to hide the bottom of the globe -->
        <div class="gradient-overlay"></div>

        <!-- The 3D Globe goes here -->
        <div class="globe-container" id="globeViz"></div>
    </div>

    <script>
        // ── 1. THE DATA FROM YOUR REACT COMPONENT ──
        const colors = ["#06b6d4", "#3b82f6", "#6366f1"];
        
        // I've included a shortened version of the massive arcs array you provided
        // to keep the file size reasonable, but you can paste the whole thing here.
        const sampleArcs = [
            { startLat: -19.885592, startLng: -43.951191, endLat: -22.9068, endLng: -43.1729, arcAlt: 0.1, color: colors[0] },
            { startLat: 28.6139, startLng: 77.209, endLat: 3.139, endLng: 101.6869, arcAlt: 0.2, color: colors[1] },
            { startLat: -19.885592, startLng: -43.951191, endLat: -1.303396, endLng: 36.852443, arcAlt: 0.5, color: colors[2] },
            { startLat: 1.3521, startLng: 103.8198, endLat: 35.6762, endLng: 139.6503, arcAlt: 0.2, color: colors[0] },
            { startLat: 51.5072, startLng: -0.1276, endLat: 3.139, endLng: 101.6869, arcAlt: 0.3, color: colors[1] },
            { startLat: 34.0522, startLng: -118.2437, endLat: 48.8566, endLng: -2.3522, arcAlt: 0.2, color: colors[2] },
            { startLat: 22.3193, startLng: 114.1694, endLat: 51.5072, endLng: -0.1276, arcAlt: 0.3, color: colors[0] },
            { startLat: -33.8688, startLng: 151.2093, endLat: 22.3193, endLng: 114.1694, arcAlt: 0.3, color: colors[1] },
            { startLat: 21.3099, startLng: -157.8581, endLat: 40.7128, endLng: -74.006, arcAlt: 0.3, color: colors[2] },
            { startLat: -6.2088, startLng: 106.8456, endLat: 51.5072, endLng: -0.1276, arcAlt: 0.3, color: colors[0] },
            // Add more from your massive list if you want it to look even crazier
        ];

        // ── 2. INITIALIZE GLOBE.GL ──
        let world;
        const globeEl = document.getElementById('globeViz');

        function initGlobe() {
            world = Globe()
                (globeEl)
                // Base globe configuration
                .backgroundColor('rgba(0,0,0,0)') // Transparent background
                .globeImageUrl(null)              // No texture, just solid color
                .showAtmosphere(true)
                .atmosphereAltitude(0.15)         // Slightly larger atmosphere
                
                // Arc configuration (The flight paths)
                .arcsData(sampleArcs)
                .arcStartLat(d => d.startLat)
                .arcStartLng(d => d.startLng)
                .arcEndLat(d => d.endLat)
                .arcEndLng(d => d.endLng)
                .arcColor(d => d.color)
                .arcAltitude(d => d.arcAlt)
                .arcDashLength(0.9)               // Long dashes
                .arcDashGap(0.2)
                .arcDashAnimateTime(1500)         // Speed of the arc animation
                .arcsTransitionDuration(0)        // Keep arcs always visible

                // Controls
                .enableZoom(false)                // Disable zoom so it doesn't break page
                .enablePan(false)
                .autoRotate(true)
                .autoRotateSpeed(0.5);

            // Apply specific colors based on current theme
            updateGlobeTheme();

            // Resize listener
            window.addEventListener('resize', () => {
                world.width(globeEl.clientWidth);
                world.height(globeEl.clientHeight);
            });
            
            // Set initial size
            world.width(globeEl.clientWidth);
            world.height(globeEl.clientHeight);
        }

        // ── 3. THEME HANDLING ──
        const root = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function updateGlobeTheme() {
            const isDark = root.getAttribute('data-theme') === 'dark';
            
            if (world) {
                const globeMaterial = world.globeMaterial();
                
                // Update globe sphere color
                globeMaterial.color = new THREE.Color(isDark ? '#09090b' : '#f4f4f5');
                globeMaterial.emissive = new THREE.Color(isDark ? '#062056' : '#e4e4e7');
                globeMaterial.emissiveIntensity = 0.1;
                globeMaterial.shininess = 0.9;

                // Update atmosphere
                world.atmosphereColor(isDark ? '#ffffff' : '#09090b');
                
                // Update arc colors if you want them to flip
                // (I'll keep them colorful for both modes so it pops)
            }
        }

        themeToggle.addEventListener('click', () => {
            const current = root.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            
            // Update Icon
            if (next === 'dark') {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
            
            // Update Globe
            updateGlobeTheme();
        });

        // Set initial icon
        if (root.getAttribute('data-theme') === 'light') {
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // ── 4. BOOT ──
        // Wait for DOM to load before initializing the heavy WebGL scene
        window.addEventListener('DOMContentLoaded', () => {
            initGlobe();
        });
    </script>
</body>
</html>
