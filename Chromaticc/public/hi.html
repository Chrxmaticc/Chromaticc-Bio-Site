<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chromaticc — Editor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg: #09090b;
            --page-bg: #000000;
            --surface: #121214;
            --surface-hover: #18181b;
            --border: #27272a;
            --text: #ffffff;
            --muted: #a1a1aa;
            --accent: #38bdf8;
            --font: 'Poppins', sans-serif;
            --chroma-accent: #ffffff;
        }

        :root[data-theme="light"] {
            --bg: #e4e4e7;
            --page-bg: #ffffff;
            --surface: #f4f4f5;
            --surface-hover: #e4e4e7;
            --border: #d4d4d8;
            --text: #09090b;
            --muted: #71717a;
            --chroma-accent: #09090b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ── TOP BAR ── */
        .top-bar {
            height: 60px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }
        .brand { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .brand-mark { width: 16px; height: 16px; background: var(--text); border-radius: 4px; }
        .top-actions { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            background: transparent; border: none; color: var(--muted);
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: 0.2s;
        }
        .icon-btn:hover { background: var(--surface); color: var(--text); }
        .btn-publish {
            background: var(--text); color: var(--bg);
            border: none; padding: 8px 16px; border-radius: 8px;
            font-weight: 600; font-size: 13px; cursor: pointer;
        }

        /* ── MAIN DOCUMENT ── */
        .document-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            padding: 40px 20px 120px 20px;
            background: var(--bg);
        }
        .page {
            width: 100%;
            max-width: 600px;
            background: var(--page-bg);
            border-radius: 12px;
            min-height: 800px;
            padding: 60px 40px;
            position: relative;
            cursor: text;
            transition: background 0.3s;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        .block-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 500px;
        }

        /* ── BLOCKS ── */
        .block-wrapper {
            position: relative;
            display: flex;
            align-items: flex-start;
            padding: 4px 0;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .drag-handle {
            position: absolute; left: -28px; top: 6px;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            color: var(--muted); cursor: grab; opacity: 0;
            transition: opacity 0.2s; border-radius: 4px;
        }
        .block-wrapper:hover .drag-handle { opacity: 1; }

        .block-settings-btn {
            position: absolute; right: -32px; top: 6px;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            color: var(--muted); cursor: pointer; opacity: 0;
            transition: opacity 0.2s; border-radius: 4px;
        }
        .block-settings-btn:hover { background: var(--surface); color: var(--text); }
        .block-wrapper:hover .block-settings-btn { opacity: 1; }

        .block-content { flex: 1; min-width: 0; }

        [contenteditable] {
            outline: none; cursor: text; padding: 4px 8px;
            min-height: 32px; font-size: 16px; line-height: 1.6;
            border-radius: 4px; transition: background 0.2s;
        }
        [contenteditable]:focus { background: var(--surface); }
        [contenteditable]:empty:before {
            content: attr(data-placeholder); color: var(--muted); pointer-events: none; display: block;
        }

        .sortable-ghost { opacity: 0.4; background: var(--surface); }
        .sortable-drag { opacity: 1 !important; }

        /* ── WIDGET STYLES ── */
        .w-text { font-size: 16px; width: 100%; }
        .w-link { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; margin: 8px 0; text-decoration: none; color: var(--text);
            font-weight: 500; transition: all 0.2s; cursor: pointer;
        }
        .w-link:hover { background: var(--surface-hover); }
        .w-profile { 
            display: flex; align-items: center; gap: 16px; padding: 20px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin: 8px 0;
        }
        .w-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--border); flex-shrink: 0; object-fit: cover; }
        .w-name { font-size: 22px; font-weight: 600; }
        .w-bio { font-size: 14px; color: var(--muted); }
        .w-image img { width: 100%; border-radius: 12px; margin: 8px 0; display: block; }

        /* ── CHROMATICC MODE ── */
        .chroma-enabled .w-link, 
        .chroma-enabled .w-profile {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid transparent;
            background-clip: padding-box, border-box;
            background-origin: border-box;
            background-image: linear-gradient(rgba(0,0,1,0.4), rgba(0,0,1,0.4)), linear-gradient(135deg, var(--chroma-accent), #ffffff, var(--chroma-accent), #ffffff, var(--chroma-accent));
            background-size: 100% 100%, 300% 300%;
            box-shadow: 0 0 32px rgba(255,255,255,0.15), 0 8px 24px rgba(0,0,0,0.4);
            animation: auroraBorder 3s ease infinite, auroraPulse 3s ease infinite;
        }
        @keyframes auroraBorder { 0%,100% { background-position: 0% 50%,0% 50%; } 50% { background-position: 0% 50%,100% 50%; } }
        @keyframes auroraPulse { 0%,100% { box-shadow: 0 0 32px rgba(255,255,255,0.1); } 50% { box-shadow: 0 0 55px rgba(255,255,255,0.3); } }

        /* ── SLASH MENU ── */
        .slash-menu {
            position: absolute;
            width: 260px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 8px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 2px;
        }
        .slash-menu.active { display: flex; }
        .slash-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer;
        }
        .slash-item:hover, .slash-item.active { background: var(--surface-hover); }
        .slash-item i { width: 20px; text-align: center; color: var(--muted); }

        /* ── BOTTOM SHEET SETTINGS ── */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 2000; backdrop-filter: blur(4px);
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }

        .sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg);
            border-radius: 24px 24px 0 0;
            padding: 24px 24px 40px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2001; max-height: 80vh; overflow-y: auto;
            border-top: 1px solid var(--border);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }
        .sheet.active { transform: translateY(0); }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-header h3 { font-size: 18px; font-weight: 600; }
        .close-sheet { background: var(--surface); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .setting-group { margin-bottom: 16px; }
        .setting-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
        .setting-group input, .setting-group textarea {
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface); font-family: var(--font); font-size: 15px; color: var(--text);
            outline: none; transition: border 0.2s;
        }
        .setting-group input:focus { border-color: var(--accent); }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .toggle-row span { font-size: 15px; font-weight: 500; }
        .switch { position: relative; width: 48px; height: 28px; background: var(--border); border-radius: 20px; cursor: pointer; transition: background 0.2s; }
        .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
        .switch.on { background: var(--accent); }
        .switch.on::after { transform: translateX(20px); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand"><div class="brand-mark"></div> Editor</div>
        <div class="top-actions">
            <button class="icon-btn" onclick="openPageSettings()"><i class="fa-solid fa-sliders"></i></button>
            <button class="btn-publish" onclick="alert('Saved to Neon!')">Publish</button>
        </div>
    </div>

    <div class="document-container" id="documentContainer">
        <div class="page" id="page">
            <div class="block-list" id="blockList"></div>
        </div>
    </div>

    <!-- Slash Menu (Positioned absolutely inside page) -->
    <div class="slash-menu" id="slashMenu">
        <div id="slashList"></div>
    </div>

    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
    <div class="sheet" id="bottomSheet">
        <div class="sheet-header">
            <h3 id="sheetTitle">Settings</h3>
            <button class="close-sheet" onclick="closeSheet()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="sheetContent"></div>
    </div>

    <script>
        const WIDGET_TYPES = [
            { type: 'text', name: 'Text Block', icon: 'fa-font' },
            { type: 'profile', name: 'Profile Card', icon: 'fa-user' },
            { type: 'link', name: 'Link Button', icon: 'fa-link' },
            { type: 'image', name: 'Image', icon: 'fa-image' }
        ];

        let layout = [];
        let pageSettings = { aurora: { enabled: false }, theme: 'dark' };
        let activeBlockId = null;
        let slashMenuIndex = 0;

        function init() {
            buildSlashMenu();
            
            // Load
            const savedLayout = localStorage.getItem('chroma_layout');
            const savedSettings = localStorage.getItem('chroma_settings');
            if (savedLayout) layout = JSON.parse(savedLayout);
            if (savedSettings) pageSettings = JSON.parse(savedSettings);

            if (layout.length === 0) {
                layout = [
                    { id: '1', type: 'profile', data: { name: 'Alex', bio: 'Designer & Builder' } },
                    { id: '2', type: 'link', data: { label: 'My Portfolio', url: '#' } }
                ];
            }

            applyPageSettings();
            render();
        }

        function generateId() { return Math.random().toString(36).substr(2, 9); }

        function render() {
            const list = document.getElementById('blockList');
            list.innerHTML = '';

            layout.forEach((block) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'block-wrapper';
                wrapper.dataset.id = block.id;

                wrapper.innerHTML = `
                    <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
                    <div class="block-settings-btn" onclick="openWidgetSettings('${block.id}')"><i class="fa-solid fa-gear"></i></div>
                `;

                const content = document.createElement('div');
                content.className = 'block-content';
                content.innerHTML = getBlockHTML(block);
                wrapper.appendChild(content);
                list.appendChild(wrapper);
            });

            if (!window.sortableInstance) {
                window.sortableInstance = new Sortable(list, {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function (evt) {
                        const [moved] = layout.splice(evt.oldIndex, 1);
                        layout.splice(evt.newIndex, 0, moved);
                        saveData();
                    }
                });
            }
        }

        function getBlockHTML(block) {
            const d = block.data;
            const update = (field) => `oninput="updateData('${block.id}', '${field}', this.innerText)"`;

            switch (block.type) {
                case 'text':
                    return `<div class="w-text" contenteditable="true" data-placeholder="Type '/' for commands..." ${update('text')}>${d.text || ''}</div>`;
                case 'profile':
                    return `<div class="w-profile">
                        <img class="w-avatar" src="${d.avatar || 'https://api.dicebear.com/7.x/initials/svg?seed=' + (d.name || 'A')}">
                        <div>
                            <div class="w-name" contenteditable="true" ${update('name')}>${d.name || 'Your Name'}</div>
                            <div class="w-bio" contenteditable="true" ${update('bio')}>${d.bio || 'Your bio'}</div>
                        </div>
                    </div>`;
                case 'link':
                    return `<a class="w-link" href="${d.url || '#'}" onclick="event.preventDefault()">
                        <span contenteditable="true" ${update('label')} style="font-weight:500;">${d.label || 'New Link'}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="color:var(--muted); font-size:12px;"></i>
                    </a>`;
                case 'image':
                    return `<div class="w-image"><img src="${d.url || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop'}"></div>`;
                default: return '';
            }
        }

        function updateData(id, field, value) {
            const block = layout.find(b => b.id === id);
            if (block) {
                block.data[field] = value;
                saveData();
            }
        }

        function addWidget(type, insertIndex) {
            const newBlock = { id: generateId(), type: type, data: getDefaultData(type) };
            if (insertIndex >= 0) layout.splice(insertIndex, 0, newBlock);
            else layout.push(newBlock);

            saveData();
            render();

            setTimeout(() => {
                const el = document.querySelector(`[data-id="${newBlock.id}"] [contenteditable]`);
                if (el) el.focus();
            }, 50);
        }

        function getDefaultData(type) {
            if (type === 'text') return { text: '' };
            if (type === 'profile') return { name: 'Your Name', bio: 'Your bio' };
            if (type === 'link') return { label: 'New Link', url: '#' };
            if (type === 'image') return { url: '' };
            return {};
        }

        /* ── SLASH MENU LOGIC (Fixed Positioning) ── */
        function buildSlashMenu() {
            document.getElementById('slashList').innerHTML = WIDGET_TYPES.map(w => `
                <div class="slash-item" data-type="${w.type}">
                    <i class="fa-solid ${w.icon}"></i> ${w.name}
                </div>
            `).join('');

            document.querySelectorAll('.slash-item').forEach(item => {
                item.onmousedown = (e) => {
                    e.preventDefault();
                    insertWidget(item.dataset.type);
                };
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && e.target.isContentEditable) {
                // Wait for the '/' to be typed so the range updates
                setTimeout(() => {
                    const sel = window.getSelection();
                    if (sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        const rect = range.getBoundingClientRect();
                        
                        activeBlockId = e.target.closest('.block-wrapper').dataset.id;
                        
                        const menu = document.getElementById('slashMenu');
                        const pageRect = document.getElementById('page').getBoundingClientRect();
                        
                        // Calculate position relative to the page, not viewport
                        const topPos = (rect.bottom - pageRect.top) + 10;
                        const leftPos = Math.max(10, (rect.left - pageRect.left));

                        menu.style.top = `${topPos}px`;
                        menu.style.left = `${leftPos}px`;
                        menu.classList.add('active');
                        highlightSlashItem(0);
                    }
                }, 10);
            }

            const menu = document.getElementById('slashMenu');
            if (menu.classList.contains('active')) {
                const items = Array.from(menu.querySelectorAll('.slash-item'));
                if (e.key === 'ArrowDown') { e.preventDefault(); highlightSlashItem((slashMenuIndex + 1) % items.length); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); highlightSlashItem((slashMenuIndex - 1 + items.length) % items.length); }
                else if (e.key === 'Enter') { e.preventDefault(); items[slashMenuIndex].dispatchEvent(new Event('mousedown')); }
                else if (e.key === 'Escape') { menu.classList.remove('active'); }
            }
        });

        function highlightSlashItem(index) {
            const items = document.querySelectorAll('.slash-item');
            items.forEach(i => i.classList.remove('active'));
            if (items[index]) { items[index].classList.add('active'); slashMenuIndex = index; }
        }

        function insertWidget(type) {
            document.getElementById('slashMenu').classList.remove('active');
            const activeEl = document.querySelector(`[data-id="${activeBlockId}"] [contenteditable]`);
            if (activeEl) {
                activeEl.innerText = activeEl.innerText.replace(/\/$/, '').trim();
                updateData(activeBlockId, 'text', activeEl.innerText);
            }
            const idx = layout.findIndex(b => b.id === activeBlockId);
            addWidget(type, idx !== -1 ? idx + 1 : layout.length);
        }

        document.getElementById('blockList').addEventListener('mousedown', (e) => {
            if (e.target.id === 'blockList' || e.target.id === 'page') {
                addWidget('text', layout.length);
            }
        });

        /* ── SETTINGS BOTTOM SHEETS ── */
        function openSheet() {
            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
        }
        function closeSheet() {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        }

        function openWidgetSettings(id) {
            activeBlockId = id;
            const block = layout.find(b => b.id === id);
            if (!block) return;

            document.getElementById('sheetTitle').innerText = `Edit ${block.type}`;
            const body = document.getElementById('sheetContent');
            
            let html = '';
            if (block.type === 'profile') {
                html = `
                    <div class="setting-group"><label>Name</label><input type="text" value="${block.data.name}" oninput="updateData('${id}', 'name', this.value)"></div>
                    <div class="setting-group"><label>Bio</label><input type="text" value="${block.data.bio}" oninput="updateData('${id}', 'bio', this.value)"></div>
                `;
            } else if (block.type === 'link') {
                html = `
                    <div class="setting-group"><label>Label</label><input type="text" value="${block.data.label}" oninput="updateData('${id}', 'label', this.value)"></div>
                    <div class="setting-group"><label>URL</label><input type="text" value="${block.data.url}" oninput="updateData('${id}', 'url', this.value)"></div>
                `;
            } else if (block.type === 'image') {
                html = `<div class="setting-group"><label>Image URL</label><input type="text" value="${block.data.url || ''}" oninput="updateData('${id}', 'url', this.value)"></div>`;
            } else {
                html = `<p style="color:var(--muted); font-size:14px;">Use inline editing to change text.</p>`;
            }

            html += `<button onclick="deleteWidget('${id}')" style="width:100%; padding:14px; border-radius:10px; border:none; background:rgba(239,68,68,0.1); color:#ef4444; font-weight:600; font-size:15px; cursor:pointer; margin-top:20px;">Delete Widget</button>`;
            body.innerHTML = html;
            openSheet();
        }

        function openPageSettings() {
            activeBlockId = null;
            document.getElementById('sheetTitle').innerText = 'Page Settings';
            const body = document.getElementById('sheetContent');
            
            body.innerHTML = `
                <div class="toggle-row">
                    <span>Chromaticc Mode</span>
                    <div class="switch ${pageSettings.aurora.enabled ? 'on' : ''}" onclick="toggleAurora(this)"></div>
                </div>
                <div class="toggle-row" style="margin-top:16px; border:none;">
                    <span>Light Theme</span>
                    <div class="switch ${pageSettings.theme === 'light' ? 'on' : ''}" onclick="toggleTheme(this)"></div>
                </div>
            `;
            openSheet();
        }

        function toggleAurora(el) {
            el.classList.toggle('on');
            pageSettings.aurora.enabled = el.classList.contains('on');
            applyPageSettings();
            saveData();
        }

        function toggleTheme(el) {
            el.classList.toggle('on');
            pageSettings.theme = el.classList.contains('on') ? 'light' : 'dark';
            applyPageSettings();
            saveData();
        }

        function applyPageSettings() {
            document.documentElement.setAttribute('data-theme', pageSettings.theme);
            const pageEl = document.getElementById('page');
            if (pageSettings.aurora.enabled) {
                pageEl.classList.add('chroma-enabled');
            } else {
                pageEl.classList.remove('chroma-enabled');
            }
        }

        function deleteWidget(id) {
            layout = layout.filter(b => b.id !== id);
            saveData();
            render();
            closeSheet();
        }

        function saveData() {
            localStorage.setItem('chroma_layout', JSON.stringify(layout));
            localStorage.setItem('chroma_settings', JSON.stringify(pageSettings));
            
            const toast = document.createElement('div');
            toast.innerText = 'Saved';
            toast.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 16px; border-radius:20px; font-size:12px; font-weight:600; z-index:9999;';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        init();
    </script>
</body>
</html>
