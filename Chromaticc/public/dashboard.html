<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromaticc – Dashboard</title>
  <link rel="icon" type="image/png" href="Chromaticc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --pink: #F4C2C2;
      --bg: #0a0a0f;
      --surface: rgba(20, 20, 30, 0.85);
      --border: rgba(244, 194, 194, 0.3);
      --text: #e0e0e0;
      --text-strong: #ffffff;
      --accent: #F4C2C2;
      --accent-dark: #ff69b4;
      --focus: #F4C2C2;
      --glass-bg: rgba(20, 20, 30, 0.6);
      --widget-bg: rgba(30, 30, 45, 0.8);
      --shadow: 0 8px 32px rgba(255, 20, 147, 0.2);
      --radius: 18px;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #ddd;
      --text: #333;
      --text-strong: #111;
      --accent: #F4C2C2;
      --accent-dark: #e6a2a2;
      --focus: #F4C2C2;
      --glass-bg: rgba(255,255,255,0.6);
      --widget-bg: rgba(255,255,255,0.9);
      --shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* SVG icons black in dark mode */
    [data-theme="dark"] .widget-item svg,
    [data-theme="dark"] .tab svg,
    [data-theme="dark"] .settings-panel svg,
    [data-theme="dark"] .canvas-widget svg {
      filter: invert(0);
      color: #000;
    }

    button:focus, input:focus, select:focus, textarea:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    @media (max-width: 768px) {
      .widget-item, .tab, .btn { padding: 12px 16px; font-size: 1rem; }
      input, select, textarea { min-height: 44px; }
    }

    .topbar {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 16px 40px;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      color: var(--text-strong);
    }
    .topbar .logo { display:flex; align-items:center; gap:12px; font-size:1.3rem; font-weight:900; }
    .topbar .logo img { width:36px; height:36px; border-radius:8px; }
    .topbar .logo span { background: linear-gradient(135deg, var(--accent), var(--text-strong)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .topbar nav { display:flex; align-items:center; gap:28px; }
    .topbar nav a { color: var(--text); text-decoration:none; font-size:0.95rem; font-weight:500; transition:0.2s; }
    .topbar nav a:hover { color: var(--accent); }
    .topbar .user-info { color: var(--text); margin-left:auto; margin-right:20px; }
    .logout-btn { background:none; border:1px solid var(--border); color: var(--text); padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.85rem; transition:0.2s; }
    .logout-btn:hover { background: rgba(244,194,194,0.2); border-color: var(--accent); }

    .theme-toggle-btn { background:none; border:1px solid var(--border); color: var(--text); padding:6px 12px; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:0.85rem; }

    .dashboard { padding:100px 20px 40px; display:flex; flex-direction:column; align-items:center; position:relative; z-index:2; }
    h1 { font-size:2.8rem; font-weight:900; margin-bottom:10px; background: linear-gradient(135deg, var(--accent), var(--text-strong)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    .tab-bar { display:flex; gap:12px; margin-bottom:30px; flex-wrap:wrap; }
    .tab { padding:12px 24px; border-radius:30px; border:1px solid var(--border); background: rgba(255,255,255,0.05); backdrop-filter:blur(12px); color: var(--text); font-weight:600; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:6px; }
    .tab.active { background: var(--accent); color:#000; border-color: var(--accent); box-shadow: 0 0 20px rgba(255,20,147,0.4); }
    .tab:hover:not(.active) { background: rgba(244,194,194,0.15); }

    .panel { display:none; width:100%; max-width:1400px; background: var(--surface); backdrop-filter: blur(25px); border:1px solid var(--border); border-radius: var(--radius); padding:30px; color: var(--text); box-shadow: var(--shadow); animation: fadeIn 0.3s ease; }
    .panel.active { display:block; }

    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

    .editor-toolbar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
    .editor-toolbar button, .editor-toolbar select { padding:10px 18px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); cursor:pointer; font-size:0.9rem; font-weight:600; transition:0.3s; }
    .editor-toolbar button:hover { background: rgba(244,194,194,0.2); }

    .canvas-container { position:relative; width:100%; height:600px; background: rgba(255,255,255,0.05); border-radius:20px; overflow:hidden; border:1px dashed var(--border); box-shadow: inset 0 0 30px rgba(255,20,147,0.05); }
    .canvas-area { position:absolute; top:0; left:0; width:100%; height:100%; }
    .canvas-widget { position:absolute; background: var(--widget-bg); border:1px solid var(--accent); border-radius:16px; min-width:20px; min-height:20px; display:flex; align-items:center; justify-content:center; font-size:0.8rem; cursor:move; backdrop-filter:blur(8px); overflow:hidden; transition: box-shadow 0.2s, border-color 0.2s; }
    .canvas-widget.selected { border-color:#fff; box-shadow:0 0 20px rgba(255,20,147,0.6); }
    .canvas-widget:not(.selected):hover { border-color: var(--accent); }
    .widget-content { width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    .resize-handle { position:absolute; width:12px; height:12px; background: #fff; border-radius:3px; opacity:0.6; }
    .resize-handle.ne { top:-6px; right:-6px; cursor:ne-resize; }
    .resize-handle.se { bottom:-6px; right:-6px; cursor:se-resize; }
    .resize-handle.sw { bottom:-6px; left:-6px; cursor:sw-resize; }
    .resize-handle.nw { top:-6px; left:-6px; cursor:nw-resize; }
    .rotate-handle { position:absolute; top:-24px; left:50%; transform:translateX(-50%); width:18px; height:18px; background: var(--accent); border-radius:50%; cursor:grab; box-shadow:0 0 10px rgba(255,20,147,0.6); }

    .widget-sidebar { width:240px; background: rgba(255,255,255,0.03); border-radius:18px; padding:14px; overflow-y:auto; flex-shrink:0; backdrop-filter:blur(15px); }
    .widget-item { display:flex; align-items:center; gap:10px; padding:12px 14px; margin:6px 0; border-radius:12px; cursor:pointer; background: rgba(255,255,255,0.05); font-size:0.85rem; font-weight:600; transition:0.2s; }
    .widget-item:hover { background: rgba(244,194,194,0.2); transform: translateX(4px); }
    .widget-item svg { width:22px; height:22px; flex-shrink:0; }

    .settings-panel { width:300px; background: rgba(255,255,255,0.03); border-radius:18px; padding:18px; overflow-y:auto; flex-shrink:0; backdrop-filter:blur(15px); }
    .settings-panel h3 { font-size:1.1rem; margin-bottom:12px; color: var(--text-strong); }
    .setting-row { margin-bottom:14px; }
    .setting-row label { display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px; color: var(--text); }
    .setting-row input, .setting-row select, .setting-row textarea { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size:0.85rem; transition:0.2s; }
    .setting-row input:focus, .setting-row select:focus, .setting-row textarea:focus { border-color: var(--accent); box-shadow:0 0 0 3px rgba(255,20,147,0.1); outline:none; }
    .btn { padding:12px 24px; border-radius:14px; font-weight:700; font-size:0.9rem; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border:none; cursor:pointer; color:#fff; transition:0.3s; box-shadow:0 8px 20px rgba(255,20,147,0.3); text-transform:uppercase; letter-spacing:0.5px; }
    .btn:hover { transform:scale(1.05); box-shadow:0 12px 30px rgba(255,20,147,0.5); }
    .btn.danger { background: linear-gradient(135deg, #b00020, #ff4444); }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color:#fff; padding:12px 28px; border-radius:30px; font-weight:600; z-index:9999; transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    .toast.show { transform:translateX(-50%) translateY(0); }

    .live-edit-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); display:flex; align-items:stretch; z-index:2000; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .live-edit-overlay.open { opacity:1; pointer-events:auto; }
    .live-iframe-container { flex:1; position:relative; }
    .live-iframe-container iframe { width:100%; height:100%; border:none; }
    .live-close-btn { position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.6); color:#fff; border:none; font-size:1.5rem; width:40px; height:40px; border-radius:50%; cursor:pointer; z-index:10; }
    .live-sidebar { width:350px; background: rgba(10,10,15,0.95); backdrop-filter:blur(20px); border-left:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.3s; }
    .live-sidebar.open { transform:translateX(0); }
    .live-sidebar-toggle { position:absolute; top:20px; left:-40px; width:40px; height:40px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:8px 0 0 8px; cursor:pointer; z-index:10; font-size:1.2rem; }
    .live-sidebar-content { flex:1; overflow-y:auto; padding:20px; color:#fff; }
    .live-sidebar-content h3 { margin-bottom:16px; }
    .live-widget-list .widget-item { background: rgba(255,255,255,0.1); color:#fff; margin:4px 0; }
    .live-settings-panel { margin-top:20px; }
    .live-settings-panel .setting-row input, .live-settings-panel .setting-row select, .live-settings-panel .setting-row textarea { background: rgba(255,255,255,0.1); color:#fff; border-color: rgba(255,255,255,0.3); }

    .simplified-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:20px; }
    .setting-card { background: rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; padding:20px; }
    .setting-card label { font-weight:600; margin-bottom:6px; display:block; }

    /* ADDED: Advanced editor styles */
    .selected-widget-toolbar {
      position: absolute;
      top: -50px;
      left: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }
    .selected-widget-toolbar.hidden { opacity: 0; pointer-events: none; }
    .mode-btn, .preset-btn, .preview-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
    }
    .mode-btn.active { border-color: var(--accent); background: rgba(244,194,194,0.2); }
    .modal-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      width: 200px;
      max-height: 200px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      z-index: 20;
      display: none;
    }
    .modal-dropdown.open { display: block; }
    .dropdown-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dropdown-item:hover { background: rgba(244,194,194,0.2); }
    .dropdown-item svg { width: 18px; height: 18px; }
    /* END ADDED */

    @media(max-width:900px) { .edit-layout { flex-direction:column; height:auto; } .widget-sidebar, .settings-panel { width:100%; } .canvas-container { height:400px; } }
  </style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- Live Edit Overlay -->
<div class="live-edit-overlay" id="liveEditOverlay">
  <div class="live-iframe-container">
    <button class="live-close-btn" id="liveEditCloseBtn">✕</button>
    <button class="live-sidebar-toggle" id="liveSidebarToggle">☰</button>
    <iframe id="liveEditIframe" src=""></iframe>
  </div>
  <div class="live-sidebar" id="liveSidebar">
    <div class="live-sidebar-content">
      <h3>Widgets</h3>
      <div class="live-widget-list" id="liveWidgetList"></div>
      <div class="live-settings-panel" id="liveSettingsPanel">
        <h3>Settings</h3>
        <p id="liveNoWidgetSelected">Select a widget</p>
        <div id="liveWidgetSettingsForm" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<div style="position:relative;z-index:2;">
  <header class="topbar">
    <div class="logo">
      <img src="Chromaticc.png" alt="Chromaticc Logo">
      <span>Chromaticc</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Features</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <button class="theme-toggle-btn" id="themeToggleBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span id="themeToggleLabel">Dark</span>
    </button>
    <span class="user-info" id="usernameDisplay"></span>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="dashboard">
    <h1>Dashboard</h1>
    <div class="tab-bar">
      <button class="tab active" data-panel="general">General</button>
      <button class="tab" data-panel="simplified">Simplified</button>
      <button class="tab" data-panel="edit">Edit Mode</button>
      <button class="tab" data-panel="settings">Settings</button>
    </div>

    <div class="panel active" id="panel-general">
      <h2>Profile Overview</h2>
      <p>Views: <strong id="viewCount">0</strong></p>
      <div style="margin:20px 0;">
        <label><input type="checkbox" id="globalClickToEnter"> Enable Click‑to‑Enter (audio requires click)</label>
      </div>
      <button class="btn" id="openPageSettings">Page Settings</button>
    </div>

    <div class="panel" id="panel-simplified">
      <h2>Simplified Customisation</h2>
      <div class="simplified-grid">
        <div class="setting-card"><label>Background Type</label><select id="simpBgType"><option value="css">CSS (gradient/color)</option><option value="image">Image</option><option value="video">Video</option></select></div>
        <div class="setting-card"><label>Background Value (CSS string or URL)</label><input type="text" id="simpBgValue" placeholder="linear-gradient(180deg, #000, #F4C2C2)"></div>
        <div class="setting-card"><label>Or Upload Background File</label><input type="file" id="simpBgFile"></div>
        <div class="setting-card"><label>Default Font Family</label><select id="simpFontFamily"><option>Inter</option><option>Arial</option><option>Georgia</option></select></div>
        <div class="setting-card"><label>Default Font Size</label><input type="number" id="simpFontSize" value="16"></div>
        <div class="setting-card"><label>Default Text Color</label><input type="text" id="simpTextColor" value="#ffffff"></div>
        <div class="setting-card"><label>Glassmorphism</label><input type="checkbox" id="simpGlass" checked></div>
        <div class="setting-card"><label>Custom Cursor URL</label><input type="text" id="simpCursor" placeholder="https://..."></div>
        <div class="setting-card"><label>Favicon URL</label><input type="text" id="simpFavicon" placeholder="https://..."></div>
        <div class="setting-card"><label>Overlay Effect</label><select id="simpOverlay"><option value="none">None</option><option value="rain">Rain</option><option value="sparkles">Sparkles</option></select></div>
      </div>
      <button class="btn" id="saveSimplified" style="margin-top:20px;">Save Simplified Settings</button>
    </div>

    <div class="panel" id="panel-edit">
      <div class="editor-toolbar">
        <button id="saveBtn">💾 Save</button>
        <button id="undoBtn">↩ Undo</button>
        <button id="redoBtn">↪ Redo</button>
        <select id="templateSelect"><option value="">-- Apply Template --</option><option value="gamer">Gamer</option><option value="artist">Artist</option><option value="minimal">Minimal</option><option value="retro">Retro</option><option value="neon">Neon</option></select>
        <button id="duplicateBtn">📋 Duplicate</button>
        <button id="deleteBtn" class="danger">🗑 Delete</button>
        <span style="margin-left:auto;">Snap: <input type="checkbox" id="snapToggle" checked></span>
        <span>Zoom: <input type="range" id="zoomSlider" min="10" max="300" value="100" style="width:120px;"><span id="zoomValue">100%</span></span>
        <button id="previewBtn">👁 Preview</button>
        <button id="liveEditBtn">▶ Live Edit</button>
        <!-- ADDED: Preview mode toggle and device preset dropdown -->
        <button id="previewModeBtn" class="preview-btn" title="Toggle Box/Live Preview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div style="position:relative;">
          <button id="devicePresetBtn" class="preset-btn" title="Device Presets">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="12" rx="2"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
            <span>Presets</span>
          </button>
          <div id="devicePresetDropdown" class="modal-dropdown">
            <div class="dropdown-item" data-preset="pc">PC</div>
            <div class="dropdown-item" data-preset="ipad">iPad</div>
            <div class="dropdown-item" data-preset="iphone">iPhone</div>
            <div class="dropdown-item" data-preset="custom">Custom</div>
          </div>
        </div>
        <!-- END ADDED -->
      </div>
      <div class="edit-layout" style="display:flex; gap:12px;">
        <div class="widget-sidebar" id="widgetList"></div>
        <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
          <div class="canvas-container" id="canvasContainer">
            <div class="canvas-area" id="canvas"></div>
            <!-- ADDED: Selected widget toolbar -->
            <div id="selectedWidgetToolbar" class="selected-widget-toolbar hidden">
              <button class="mode-btn active" data-mode="position" title="Position">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M12 3v18"/></svg>
              </button>
              <button class="mode-btn" data-mode="rotate" title="Rotation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><polyline points="20 4 20 8 16 8"/></svg>
              </button>
              <button class="mode-btn" data-mode="resize" title="Resize">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L20 4"/><path d="M14 4h6v6"/><path d="M4 10v6h6"/></svg>
              </button>
            </div>
            <!-- END ADDED -->
          </div>
        </div>
        <div class="settings-panel" id="settingsPanel">
          <h3>Widget Settings</h3>
          <p id="noWidgetSelected">Select a widget</p>
          <div id="widgetSettingsForm" style="display:none;"></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-settings">
      <h2>Account Settings</h2>
      <input type="password" id="currentPass" placeholder="Current password"><br><br>
      <input type="password" id="newPass" placeholder="New password"><br><br>
      <button class="btn" id="changePassBtn">Change Password</button>
      <hr style="margin:20px 0; border-color: var(--border);">
      <button class="btn" id="settingsLogoutBtn">Logout</button>
      <button class="btn danger" id="deleteAccountBtn">Delete Account</button>
    </div>
  </div>

  <div class="modal-overlay" id="pageSettingsModal" style="display:none;">
    <div class="modal">
      <h2>Page Settings (Legacy)</h2>
      <div class="setting-row"><label>Background Type: <select id="bgType"><option value="css">CSS</option><option value="image">Image</option><option value="video">Video</option></select></label></div>
      <div class="setting-row"><label>Background Value <input type="text" id="bgValue"></label></div>
      <div class="setting-row"><label>Or Upload File <input type="file" id="bgFile"></label></div>
      <div class="setting-row"><label>Cursor URL <input type="text" id="cursorUrl"></label></div>
      <div class="setting-row"><label>Favicon URL <input type="text" id="faviconUrl"></label></div>
      <div class="setting-row"><label>Overlay <select id="overlayEffect"><option value="none">None</option><option value="rain">Rain</option><option value="sparkles">Sparkles</option></select></label></div>
      <button class="btn" id="savePageSettings">Save</button>
      <button class="btn" onclick="document.getElementById('pageSettingsModal').style.display='none'">Close</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ─── Auth ───────────────────────────
    const token = localStorage.getItem('chromaticc_token');
    const user = JSON.parse(localStorage.getItem('chromaticc_user') || '{}');
    if (!token || !user.username) window.location.href = '/accounts.html';
    document.getElementById('usernameDisplay').textContent = `@${user.username}`;
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '/'; };
    document.getElementById('settingsLogoutBtn').onclick = () => { localStorage.clear(); window.location.href = '/'; };

    // ─── Theme Toggle ──────────────────
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeToggleLabel = document.getElementById('themeToggleLabel');
    const htmlElement = document.documentElement;
    function setTheme(theme) {
      htmlElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      themeToggleLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    });

    // ─── Toast ──────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ─── Views Counter ──────────────────
    const viewEl = document.getElementById('viewCount');
    async function loadViewCount() {
      try {
        const res = await fetch('/api/increment-view', {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to fetch view count');
        const data = await res.json();
        animateViews(data.count || 0);
      } catch (err) {
        animateViews(0);
      }
    }
    function animateViews(target) {
      let start = null;
      const duration = 1000;
      function step(ts) {
        if (!start) start = ts;
        const progress = Math.min((ts - start) / duration, 1);
        viewEl.textContent = Math.floor(progress * target);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    loadViewCount();

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const panelId = 'panel-' + tab.dataset.panel;
        const panel = document.getElementById(panelId);
        if (panel) {
          document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

        }

    });

    // ─── Canvas state ─────────────────
    let layout = [];

    // ─── Helpers ──────────────────────
    const pxX = p => (p/100)*1200, pxY = p => (p/100)*800;
    const percX = px => (px/1200)*100, percY = py => (py/800)*100;

    // ─── Load/Save Layout ─────────────
    async function loadLayout() {
      try {
        const res = await fetch('/api/get-layout', { headers:{Authorization:`Bearer ${token}`} });
        const data = await res.json();
        layout = data.layout || [];
        pageSettings = data.settings || {};
        renderCanvas();
      } catch(e) {}
    }
    async function saveLayout() {
      try {
        layout = layout.filter(w => w.type !== 'background' && w.type !== 'bg-animation');
        await fetch('/api/save-layout', {
          method:'POST',
          headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
          body: JSON.stringify({layout, settings:pageSettings})
        });
        showToast('Saved!');
      } catch(e) { showToast('Save failed'); }
    }

    // ─── Undo/Redo ───────────────────
    function pushUndo() { history.push(JSON.parse(JSON.stringify(layout))); if(history.length>30) history.shift(); future=[]; }
    function undo() { if(!history.length) return; future.push(JSON.parse(JSON.stringify(layout))); layout=history.pop(); renderCanvas(); }
    function redo() { if(!future.length) return; history.push(JSON.parse(JSON.stringify(layout))); layout=future.pop(); renderCanvas(); }

    function renderCanvas() {
      canvas.style.transform = `scale(${zoom})`;
      canvas.style.transformOrigin = '0 0';
      canvas.innerHTML = '';
      layout.forEach(w => {
        const el = document.createElement('div');
        el.className = 'canvas-widget';
        el.dataset.id = w.id;
        el.style.left = pxX(w.x) + 'px';
        el.style.top = pxY(w.y) + 'px';
        el.style.width = pxX(w.w) + 'px';
        el.style.height = pxY(w.h) + 'px';
        el.style.transform = `rotate(${w.rotation||0}deg)`;
        const content = document.createElement('div');
        content.className = 'widget-content';
        content.innerHTML = renderWidgetPreview(w);
        el.appendChild(content);
        el.innerHTML += '<div class="resize-handle ne"></div><div class="resize-handle se"></div><div class="resize-handle sw"></div><div class="resize-handle nw"></div><div class="rotate-handle"></div>';
        canvas.appendChild(el);
        makeInteractive(el, w);
        el.addEventListener('click', e => { e.stopPropagation(); selectWidget(w.id); });
      });

      // ADDED: Show/hide toolbar and apply live mode
      if (previewMode === 'live') {
        document.querySelectorAll('.canvas-widget').forEach(el => {
          el.style.background = 'transparent';
          el.style.border = 'none';
          el.style.backdropFilter = 'none';
          el.querySelectorAll('.resize-handle, .rotate-handle').forEach(h => h.remove());
        });
      }
      const toolbar = document.getElementById('selectedWidgetToolbar');
      if (selectedId && previewMode === 'box') {
        const w = layout.find(w => w.id === selectedId);
        if (w) {
          const selectedEl = canvas.querySelector(`.canvas-widget[data-id="${selectedId}"]`);
          if (selectedEl) {
            toolbar.classList.remove('hidden');
            toolbar.style.top = '-50px';
            toolbar.style.left = '0';
            selectedEl.appendChild(toolbar);
            toolbar.querySelectorAll('.mode-btn').forEach(btn => {
              btn.classList.toggle('active', btn.dataset.mode === editMode);
              btn.onclick = (e) => {
                e.stopPropagation();
                editMode = btn.dataset.mode;
                toolbar.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                makeInteractive(selectedEl, w);
              };
            });
          }
        }
      } else {
        toolbar.classList.add('hidden');
      }
    }

    function makeInteractive(el, widget) {
      // ADDED: destroy previous interact instance if exists
      if (el._interact) el._interact.destroy();

      if (editMode === 'position') {
        el._interact = interact(el).draggable({ listeners: { start() { pushUndo(); }, move(e) {
          let nx = widget.x + percX(e.dx), ny = widget.y + percY(e.dy);
          if(snap){ nx = Math.round(nx/5)*5; ny = Math.round(ny/5)*5; }
          widget.x = Math.min(100-widget.w, Math.max(0, nx));
          widget.y = Math.min(100-widget.h, Math.max(0, ny));
          el.style.left = pxX(widget.x)+'px'; el.style.top = pxY(widget.y)+'px';
        }}});
      } else if (editMode === 'resize') {
        el._interact = interact(el).resizable({
          edges: { top:false, left:false, bottom:false, right:false },
          listeners: { start() { pushUndo(); }, move(e) {
            widget.w = percX(e.rect.width); widget.h = percY(e.rect.height);
            el.style.width = pxX(widget.w)+'px'; el.style.height = pxY(widget.h)+'px';
          }}
        });
      } else if (editMode === 'rotate') {
        const rotHandle = el.querySelector('.rotate-handle');
        if (rotHandle) {
          el._interact = interact(rotHandle).draggable({
            listeners: { start() { pushUndo(); }, move(e) {
              const angle = Math.atan2(e.dy, e.dx) * (180/Math.PI);
              widget.rotation = (widget.rotation||0) + angle*0.3;
              el.style.transform = `rotate(${widget.rotation}deg)`;
            }}
          });
        }
      }
    }

    function selectWidget(id) {
      // unchanged
      selectedId = id;
      document.querySelectorAll('.canvas-widget').forEach(e=>e.classList.remove('selected'));
      const el = document.querySelector(`.canvas-widget[data-id="${id}"]`);
      if(el) el.classList.add('selected');
      const w = layout.find(w=>w.id===id);
      if(!w) { noWidget.style.display='block'; settingsDiv.style.display='none'; return; }
      noWidget.style.display='none'; settingsDiv.style.display='block';
      const def = widgetTypes.find(t=>t.type===w.type);
      if(!def) return;
      let html = `<h4>${def.name}</h4>`;
      for(const [key,val] of Object.entries(def.defaults)) {
        const cur = w.settings?.[key] !== undefined ? w.settings[key] : val;
        if(key==='src'||key==='url'||key==='audioUrl'||key==='videoUrl'||key==='avatar') {
          html += `<div class="setting-row"><label>${key} (URL or upload)</label>
            <input type="text" data-key="${key}" value="${cur}" placeholder="Paste URL here...">
            <input type="file" data-key="${key}" ${def.fileAccept ? `accept="${def.fileAccept}"` : ''}>
            ${cur ? `<small>Current: ${cur}</small>` : ''}
          </div>`;
        } else if(typeof cur==='boolean') {
          html += `<div class="setting-row"><label>${key} <input type="checkbox" data-key="${key}" ${cur?'checked':''}></label></div>`;
        } else if(key==='badges'||key==='games'||key==='tasks'||key==='notes') {
          html += `<div class="setting-row"><label>${key} (comma separated)</label><input type="text" data-key="${key}" value="${Array.isArray(cur)?cur.join(','):cur}"></div>`;
        } else if(key==='style'||key==='mode'||key==='shape'||key==='format'||key==='avatarPosition'||key==='textPosition'||key==='direction'||key==='unit'||key==='color'||key==='mood') {
          html += `<div class="setting-row"><label>${key}</label><input type="text" data-key="${key}" value="${cur}"></div>`;
        } else {
          html += `<div class="setting-row"><label>${key}</label><input type="text" data-key="${key}" value="${cur}"></div>`;
        }
      }
      html += '<button class="btn" id="applySettingsBtn">Apply</button>';
      settingsDiv.innerHTML = html;
      document.getElementById('applySettingsBtn').onclick = () => applySettings(w);
      // ADDED: re-render to show toolbar immediately
      renderCanvas();
    }

    async function applySettings(widget) {
      // unchanged
    }

    function addWidget(type) {
      // unchanged
    }
    function deleteSelected() { /* unchanged */ }
    function duplicateSelected() { /* unchanged */ }

    // ─── Populate sidebar ────────────
    const wl = document.getElementById('widgetList');
    widgetTypes.forEach(wt => {
      const d = document.createElement('div'); d.className='widget-item';
      d.innerHTML = wt.icon + wt.name;
      d.onclick = () => addWidget(wt.type);
      wl.appendChild(d);
    });

    // ─── Toolbar actions ─────────────
    document.getElementById('saveBtn').onclick = saveLayout;
    // ... (existing event listeners)
    document.getElementById('previewBtn').onclick = () => window.open(`/${user.username}`, '_blank');
    document.getElementById('liveEditBtn').onclick = () => {
      document.getElementById('liveEditIframe').src = `/${user.username}`;
      document.getElementById('liveEditOverlay').classList.add('open');
    };
    // ... existing close/toggle listeners

    // ADDED: Event listeners for new buttons
    document.getElementById('previewModeBtn').onclick = function() {
      previewMode = previewMode === 'box' ? 'live' : 'box';
      renderCanvas();
    };

    const presetBtn = document.getElementById('devicePresetBtn');
    const dropdown = document.getElementById('devicePresetDropdown');
    presetBtn.onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle('open'); };
    document.addEventListener('click', () => dropdown.classList.remove('open'));
    document.querySelectorAll('.dropdown-item[data-preset]').forEach(item => {
      item.onclick = (e) => {
        e.stopPropagation();
        const preset = item.dataset.preset;
        if (preset === 'custom') {
          const w = prompt('Width %'); const h = prompt('Height %');
          if (w && h) applyPresetToAll(parseFloat(w), parseFloat(h));
        } else {
          const map = { pc:{w:30,h:20}, ipad:{w:45,h:30}, iphone:{w:70,h:40} };
          if (map[preset]) applyPresetToAll(map[preset].w, map[preset].h);
        }
        dropdown.classList.remove('open');
      };
    });
    function applyPresetToAll(w, h) {
      layout.forEach(widget => { widget.w = w; widget.h = h; });
      pushUndo();
      renderCanvas();
      showToast('Preset applied');
    }
    // END ADDED

        // ─── Simplified save ─────────────
    document.getElementById('saveSimplified').onclick = async () => {
      const bgType = document.getElementById('simpBgType').value;
      let bgValue = document.getElementById('simpBgValue').value.trim();
      const bgFile = document.getElementById('simpBgFile').files[0];
      if (bgFile) {
        const form = new FormData(); form.append('file', bgFile);
        const res = await fetch('/api/upload', { method:'POST', body:form });
        const data = await res.json();
        if (data.url) bgValue = data.url;
      }
      if (bgType === 'image' || bgType === 'video') {
        if (bgValue.startsWith('url(')) bgValue = bgValue.slice(4, -1).replace(/^['"]|['"]$/g, '');
      }
      pageSettings.background = { type: bgType, value: bgValue || 'linear-gradient(180deg, #000, #F4C2C2)' };
      pageSettings.fontFamily = document.getElementById('simpFontFamily').value;
      pageSettings.fontSize = document.getElementById('simpFontSize').value;
      pageSettings.textColor = document.getElementById('simpTextColor').value;
      pageSettings.glass = document.getElementById('simpGlass').checked;
      pageSettings.cursor = document.getElementById('simpCursor').value;
      pageSettings.favicon = document.getElementById('simpFavicon').value;
      pageSettings.overlay = document.getElementById('simpOverlay').value;
      await fetch('/api/save-layout', { method:'POST', headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`}, body:JSON.stringify({layout, settings:pageSettings}) });
      showToast('Simplified saved!');
    };
        // ─── Legacy modal ────────────────
    document.getElementById('openPageSettings').onclick = () => document.getElementById('pageSettingsModal').style.display='flex';
    document.getElementById('savePageSettings').onclick = async () => {
      const bgType = document.getElementById('bgType').value;
      let bgValue = document.getElementById('bgValue').value.trim();
      const bgFile = document.getElementById('bgFile').files[0];
      if (bgFile) {
        const form = new FormData(); form.append('file', bgFile);
        const res = await fetch('/api/upload', { method:'POST', body:form });
        const data = await res.json();
        if (data.url) bgValue = data.url;
      }
      let finalValue = '';
      if (bgType === 'css') finalValue = bgValue || 'linear-gradient(180deg, #000, #F4C2C2)';
      else { if(bgValue.startsWith('url(')) finalValue = bgValue.slice(4,-1).replace(/^['"]|['"]$/g,''); else finalValue = bgValue || ''; }
      pageSettings.background = { type: bgType, value: finalValue };
      pageSettings.cursor = document.getElementById('cursorUrl').value;
      pageSettings.favicon = document.getElementById('faviconUrl').value;
      pageSettings.overlay = document.getElementById('overlayEffect').value;
      document.getElementById('pageSettingsModal').style.display='none';
      showToast('Saved – now save layout');
    };
    
    // ─── Account ────────────────────
    document.getElementById('changePassBtn').onclick = async () => {
      const cur = document.getElementById('currentPass').value, nw = document.getElementById('newPass').value;
      if(!cur||!nw) return showToast('Fill both');
      const res = await fetch('/api/change-password', { method:'POST', headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`}, body:JSON.stringify({currentPassword:cur,newPassword:nw}) });
      showToast(res.ok ? 'Changed!' : 'Failed');
    };
    document.getElementById('deleteAccountBtn').onclick = () => {
      if(confirm('Delete account?')) fetch('/api/delete-account', { method:'DELETE', headers:{Authorization:`Bearer ${token}`} }).then(()=>{ localStorage.clear(); window.location.href='/'; });
    };
    document.getElementById('settingsLogoutBtn').onclick = () => { localStorage.clear(); window.location.href = '/'; };

    // ─── Start ──────────────────────
    loadLayout();
  })();
