<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromaticc – Dashboard</title>
  <link rel="icon" type="image/png" href="Chromaticc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body::before {
      content: '';
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1;
      background: url('background.jpeg') center/cover no-repeat fixed;
      opacity:0.35; filter: brightness(0.6) saturate(0.6);
      animation: slowPan 50s linear infinite alternate;
    }
    @keyframes slowPan {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.15) translate(-3%, -2%); }
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.92) 0%, rgba(224,224,224,0.9) 30%,
        rgba(128,128,128,0.85) 60%, rgba(26,26,26,0.9) 85%,
        rgba(0,0,0,0.95) 100%);
      background-attachment: fixed; color:#000; min-height:100vh; overflow-x:hidden;
    }
    .particles { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .particle { position:absolute; background:rgba(192,192,192,0.7); border-radius:50%; width:2px; height:2px; animation: rise linear infinite; }
    @keyframes rise {
      0% { transform: translateY(100vh) scale(0); opacity:0; } 10% { opacity:1; } 90% { opacity:1; }
      100% { transform: translateY(-10vh) scale(2); opacity:0; }
    }
    .splatter-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }
    .splatter-img { position:absolute; opacity:0; transition:opacity 0.8s; user-select:none; filter:drop-shadow(0 0 15px rgba(0,0,0,0.3)); animation:float 7s ease-in-out infinite; animation-delay:calc(var(--delay)*1s); will-change:transform; }
    @keyframes float {
      0%,100%{ transform:translateY(0px) rotate(var(--rot)); } 50%{ transform:translateY(-16px) rotate(var(--rot)); }
    }

    .topbar {
      position:fixed; top:0; left:0; width:100%; padding:16px 40px; display:flex; justify-content:space-between; align-items:center;
      background:transparent; backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.08); z-index:1000; color:#fff;
    }
    .topbar .logo { display:flex; align-items:center; gap:12px; font-size:1.3rem; font-weight:900; }
    .topbar .logo img { width:36px; height:36px; border-radius:8px; }
    .topbar .logo span { background:linear-gradient(135deg,#fff,#aaa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .topbar nav { display:flex; align-items:center; gap:28px; }
    .topbar nav a { color:#ccc; text-decoration:none; font-size:0.95rem; font-weight:500; transition:0.2s; }
    .topbar nav a:hover { color:#fff; }
    .topbar .user-info { color:#ccc; margin-left:auto; margin-right:20px; }
    .logout-btn { background:none; border:1px solid #ccc; color:#ccc; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.85rem; transition:0.2s; }
    .logout-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }

    .dashboard { padding:100px 20px 40px; display:flex; flex-direction:column; align-items:center; position:relative; z-index:2; }
    h1 { font-size:2.8rem; font-weight:900; margin-bottom:10px; background:linear-gradient(135deg,#000,#fff,#444); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .tab-bar { display:flex; gap:12px; margin-bottom:30px; }
    .tab { padding:12px 24px; border-radius:30px; border:1px solid rgba(0,0,0,0.2); background:rgba(255,255,255,0.2); backdrop-filter:blur(12px); color:#000; font-weight:600; cursor:pointer; transition:0.2s; }
    .tab.active { background:rgba(0,0,0,0.8); color:#fff; border-color:#000; }

    .panel { display:none; width:100%; max-width:1400px; background:rgba(255,255,255,0.15); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.2); border-radius:28px; padding:30px; color:#000; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
    .panel.active { display:block; }

    .editor-toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
    .editor-toolbar button, .editor-toolbar select { padding:8px 12px; border-radius:8px; border:1px solid rgba(0,0,0,0.2); background:rgba(255,255,255,0.5); cursor:pointer; font-size:0.85rem; transition:0.2s; }
    .editor-toolbar button:hover { background:rgba(255,255,255,0.8); }
    .canvas-container { position:relative; width:100%; height:600px; background:rgba(255,255,255,0.2); border-radius:16px; overflow:hidden; border:1px dashed #aaa; }
    .canvas-area { position:absolute; top:0; left:0; width:100%; height:100%; }
    .canvas-widget {
      position:absolute; background:rgba(255,255,255,0.6); border:1px solid #000;
      border-radius:12px; min-width:20px; min-height:20px; display:flex; align-items:center; justify-content:center;
      font-size:0.8rem; cursor:move; user-select:none; backdrop-filter:blur(4px); overflow:hidden;
      transition: box-shadow 0.2s;
    }
    .canvas-widget.selected { border-color:#ff3c78; box-shadow:0 0 0 2px #ff3c78; }
    .widget-content { width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    .resize-handle { position:absolute; width:10px; height:10px; background:#000; border-radius:2px; opacity:0.5; }
    .resize-handle.ne { top:-5px; right:-5px; cursor:ne-resize; }
    .resize-handle.se { bottom:-5px; right:-5px; cursor:se-resize; }
    .resize-handle.sw { bottom:-5px; left:-5px; cursor:sw-resize; }
    .resize-handle.nw { top:-5px; left:-5px; cursor:nw-resize; }
    .rotate-handle { position:absolute; top:-20px; left:50%; transform:translateX(-50%); width:14px; height:14px; background:#ff3c78; border-radius:50%; cursor:grab; }

    .widget-sidebar { width:220px; background:rgba(255,255,255,0.3); border-radius:16px; padding:12px; overflow-y:auto; flex-shrink:0; }
    .widget-item { display:flex; align-items:center; gap:8px; padding:8px 10px; margin:4px 0; border-radius:8px; cursor:pointer; background:rgba(255,255,255,0.5); font-size:0.85rem; transition:0.2s; }
    .widget-item:hover { background:rgba(0,0,0,0.1); }
    .widget-item svg { width:20px; height:20px; flex-shrink:0; }

    .settings-panel { width:280px; background:rgba(255,255,255,0.3); border-radius:16px; padding:16px; overflow-y:auto; flex-shrink:0; }
    .settings-panel h3 { font-size:1rem; margin-bottom:8px; }
    .setting-row { margin-bottom:10px; }
    .setting-row label { display:block; font-size:0.8rem; margin-bottom:2px; }
    .setting-row input, .setting-row select, .setting-row textarea { width:100%; padding:6px; border-radius:6px; border:1px solid rgba(0,0,0,0.2); background:rgba(255,255,255,0.7); font-size:0.85rem; }
    .setting-row input[type="file"] { padding:3px; }
    .btn { padding:8px 16px; border-radius:14px; font-weight:600; font-size:0.9rem; background:linear-gradient(135deg,#e0e0e0,#808080); border:none; cursor:pointer; color:#0a0a0a; transition:0.2s; }
    .btn:hover { transform:scale(1.02); }
    .btn.danger { background:#b00020; color:#fff; }

    .modal-overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5); backdrop-filter:blur(8px);
      display:flex; align-items:center; justify-content:center; z-index:2000;
    }
    .modal { background:rgba(255,255,255,0.8); backdrop-filter:blur(20px); border-radius:24px; padding:30px; max-width:500px; width:90%; }

    @media(max-width:768px){
      .edit-layout { flex-direction:column; height:auto; }
      .widget-sidebar, .settings-panel { width:100%; }
    }
  </style>
</head>
<body>
<div class="particles" id="particlesContainer"></div>
<div class="splatter-container" id="splatterContainer"></div>

<div style="position:relative;z-index:2;">
  <header class="topbar">
    <div class="logo">
      <img src="Chromaticc.png" alt="Chromaticc Logo">
      <span>Chromaticc</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Features</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <span class="user-info" id="usernameDisplay"></span>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="dashboard">
    <h1>Dashboard</h1>
    <div class="tab-bar">
      <button class="tab active" data-panel="general">General</button>
      <button class="tab" data-panel="edit">Edit Mode</button>
      <button class="tab" data-panel="settings">Settings</button>
    </div>

    <!-- General Panel -->
    <div class="panel active" id="panel-general">
      <h2>Profile Overview</h2>
      <p>Views: <strong id="viewCount">--</strong></p>
      <h3>Quick Toggles</h3>
      <label><input type="checkbox" id="globalGlass"> Enable Glassmorphism on profile</label><br>
      <label><input type="checkbox" id="clickToEnter"> Click‑to‑Enter Audio</label><br>
      <button class="btn" id="openPageSettings">⚙️ Page Settings</button>
    </div>

    <!-- Edit Mode Panel -->
    <div class="panel" id="panel-edit">
      <div class="editor-toolbar">
        <button id="saveBtn">💾 Save</button>
        <button id="undoBtn">↩ Undo</button>
        <button id="redoBtn">↪ Redo</button>
        <select id="templateSelect">
          <option value="">-- Apply Template --</option>
          <option value="gamer">🎮 Gamer</option>
          <option value="artist">🎨 Artist</option>
          <option value="minimal">✨ Minimal</option>
          <option value="retro">📼 Retro</option>
          <option value="neon">💡 Neon</option>
        </select>
        <button id="duplicateBtn">📋 Duplicate</button>
        <button id="deleteBtn" class="danger">🗑 Delete</button>
        <span style="margin-left:auto;">Snap: <input type="checkbox" id="snapToggle" checked></span>
        <span>Zoom: <input type="range" id="zoomSlider" min="50" max="200" value="100" style="width:80px;"></span>
        <button id="previewBtn">👁 Preview</button>
      </div>
      <div class="edit-layout" style="display:flex; gap:12px;">
        <div class="widget-sidebar" id="widgetList"></div>
        <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
          <div class="canvas-container" id="canvasContainer">
            <div class="canvas-area" id="canvas"></div>
          </div>
        </div>
        <div class="settings-panel" id="settingsPanel">
          <h3>Widget Settings</h3>
          <p id="noWidgetSelected">Select a widget</p>
          <div id="widgetSettingsForm" style="display:none;"></div>
        </div>
      </div>
    </div>

    <!-- Account Settings Panel -->
    <div class="panel" id="panel-settings">
      <h2>Account Settings</h2>
      <input type="password" id="currentPass" placeholder="Current password"><br>
      <input type="password" id="newPass" placeholder="New password"><br>
      <button class="btn" id="changePassBtn">Change Password</button>
      <hr>
      <button class="btn danger" id="deleteAccountBtn">Delete Account</button>
    </div>
  </div>

  <!-- Page Settings Modal -->
  <div class="modal-overlay" id="pageSettingsModal" style="display:none;">
    <div class="modal">
      <h2>Profile Page Settings</h2>
      <div class="setting-row"><label>Background Type: <select id="bgType"><option value="solid">Solid Color</option><option value="gradient">Gradient</option><option value="image">Image File</option><option value="video">Video File</option></select></label></div>
      <div class="setting-row"><input type="file" id="bgFile" accept="image/*,video/*"></div>
      <div class="setting-row"><label>Or Color/Gradient: <input type="text" id="bgColor" placeholder="e.g., #fff or linear-gradient(...)"></label></div>
      <div class="setting-row"><label>Custom Cursor: <input type="file" id="cursorFile" accept=".png,.cur"></label></div>
      <div class="setting-row"><label>Favicon: <input type="file" id="faviconFile" accept="image/png,image/x-icon"></label></div>
      <div class="setting-row"><label>Overlay Effect: <select id="overlayEffect"><option value="none">None</option><option value="rain">Rain</option><option value="sparkles">Sparkles</option></select></label></div>
      <button class="btn" id="savePageSettings">Save</button>
      <button class="btn" onclick="document.getElementById('pageSettingsModal').style.display='none'">Close</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ─── AUTH ───────────────────────────
    const token = localStorage.getItem('chromaticc_token');
    const user = JSON.parse(localStorage.getItem('chromaticc_user') || '{}');
    if (!token || !user.username) window.location.href = '/accounts.html';
    document.getElementById('usernameDisplay').textContent = `@${user.username}`;
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '/'; };

    // ─── PARTICLES & SPLATTER ─────────
    const pc = document.getElementById('particlesContainer');
    for(let i=0;i<40;i++) {
      const p = document.createElement('div'); p.className='particle';
      p.style.left=Math.random()*100+'%'; p.style.top=Math.random()*100+'%';
      p.style.animationDuration=(Math.random()*8+6)+'s'; p.style.animationDelay=Math.random()*5+'s';
      pc.appendChild(p);
    }
    const sources = ['Chromaticc.png','Chromaticc-Happy.png','Chromaticc-Speaker.png','Chromaticc-Doctor.png'];
    const sc = document.getElementById('splatterContainer');
    for(let i=0;i<24;i++) {
      const img = document.createElement('img'); img.src=sources[i%sources.length]; img.className='splatter-img';
      img.style.left=Math.random()*100+'%'; img.style.top=Math.random()*100+'%';
      img.style.width=(50+Math.random()*200)+'px';
      img.style.setProperty('--rot',((Math.random()*40)-20)+'deg');
      img.style.setProperty('--delay',Math.random()*6);
      img.style.opacity=0.08+Math.random()*0.3;
      sc.appendChild(img);
    }

    // ─── PANEL SWITCHING ──────────────
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const panelId = 'panel-' + tab.dataset.panel;
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
      });
    });

    // ─── FULL WIDGET DEFINITIONS (40+) with SVGs & defaults ─────
    const widgetTypes = [
      { type:'text', name:'Plain Text', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 12 21 20 7"/><line x1="7" y1="12" x2="17" y2="12"/></svg>', defaults:{content:'Hello world',fontSize:16,color:'#000000',bold:false,italic:false,align:'left',fontFamily:'Inter'} },

      { type:'neon-text', name:'Neon Text', icon:'<svg viewBox="0 0 24 24"><text x="0" y="20" fill="#ff00ff" filter="url(#glow)" font-size="22">N</text><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>', defaults:{content:'Neon',color:'#ff00ff',fontSize:22} },
      { type:'marquee-text', name:'Marquee Text', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>', defaults:{content:'Scrolling...',speed:5} },
      { type:'image', name:'Image', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>', defaults:{src:'',alt:'image',objectFit:'cover'} },
      { type:'video', name:'Video', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>', defaults:{src:'',controls:true,autoplay:false,loop:false} },
      { type:'audio', name:'Audio', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>', defaults:{src:'',title:'Track',volume:80} },
      { type:'youtube', name:'YouTube Embed', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29.94 29.94 0 0 0 1 12a29.94 29.94 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2A29.94 29.94 0 0 0 23 12a29.94 29.94 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor"/></svg>', defaults:{videoId:''} },

    // ─── CANVAS STATE ────────────────────
    let layout = [];
    let history = [];
    let future = [];
    let selectedId = null;
    let pageSettings = {};
    const canvas = document.getElementById('canvas');
    const settingsDiv = document.getElementById('widgetSettingsForm');
    const noWidgetMsg = document.getElementById('noWidgetSelected');
    let zoom = 1;
    let snapToGrid = true;

    const percToPixelX = (perc) => (perc / 100) * 1200;
    const percToPixelY = (perc) => (perc / 100) * 800;
    const pixelToPercX = (px) => (px / 1200) * 100;
    const pixelToPercY = (py) => (py / 800) * 100;

    async function loadLayout() {
      try {
        const res = await fetch('/api/get-layout', { headers: {'Authorization':`Bearer ${token}`} });
        if (!res.ok) throw new Error('fail');
        const data = await res.json();
        layout = data.layout || [];
        pageSettings = data.settings || {};
        renderCanvas();
      } catch(e) { console.warn('Could not load layout'); }
    }

    async function saveLayout() {
      try {
        await fetch('/api/save-layout', {
          method:'POST',
          headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
          body: JSON.stringify({ layout, settings: pageSettings })
        });
        alert('Saved!');
      } catch(e) { alert('Save failed'); }
    }

    function pushUndo() {
      history.push(JSON.parse(JSON.stringify(layout)));
      if (history.length > 30) history.shift();
      future = [];
    }

    function undo() {
      if (history.length === 0) return;
      future.push(JSON.parse(JSON.stringify(layout)));
      layout = history.pop();
      renderCanvas();
    }
    function redo() {
      if (future.length === 0) return;
      history.push(JSON.parse(JSON.stringify(layout)));
      layout = future.pop();
      renderCanvas();
    }

    function renderWidgetPreview(w) {
      const s = w.settings || {};
      switch(w.type) {
        case 'text': return `<span style="font-size:${s.fontSize}px;color:${s.color};">${s.content?.slice(0,15)}</span>`;
        case 'image': return s.src ? `<img src="${s.src}" style="max-width:100%;max-height:100%;object-fit:${s.objectFit};">` : '🖼';
        case 'video': return '<video style="max-width:100%;max-height:100%;"></video>';
        case 'clock': return '🕒';
        default: return w.type.slice(0,8);
      }
    }

    function renderCanvas() {
      canvas.style.transform = `scale(${zoom})`;
      canvas.style.transformOrigin = '0 0';
      canvas.innerHTML = '';
      layout.forEach(w => {
        const el = document.createElement('div');
        el.className = 'canvas-widget';
        el.dataset.id = w.id;
        el.style.left = percToPixelX(w.x) + 'px';
        el.style.top = percToPixelY(w.y) + 'px';
        el.style.width = percToPixelX(w.w) + 'px';
        el.style.height = percToPixelY(w.h) + 'px';
        el.style.transform = `rotate(${w.rotation||0}deg)`;
        const content = document.createElement('div');
        content.className = 'widget-content';
        content.innerHTML = renderWidgetPreview(w);
        el.appendChild(content);
        el.innerHTML += '<div class="resize-handle ne"></div><div class="resize-handle se"></div><div class="resize-handle sw"></div><div class="resize-handle nw"></div><div class="rotate-handle"></div>';
        canvas.appendChild(el);
        makeInteractive(el, w);
        el.addEventListener('click', (e) => { e.stopPropagation(); selectWidget(w.id); });
      });
    }

    function makeInteractive(el, widget) {
      interact(el)
        .draggable({
          listeners: {
            start() { pushUndo(); },
            move(e) {
              let newX = widget.x + pixelToPercX(e.dx);
              let newY = widget.y + pixelToPercY(e.dy);
              if (snapToGrid) { newX = Math.round(newX/5)*5; newY = Math.round(newY/5)*5; }
              widget.x = Math.min(100-widget.w, Math.max(0, newX));
              widget.y = Math.min(100-widget.h, Math.max(0, newY));
              el.style.left = percToPixelX(widget.x) + 'px';
              el.style.top = percToPixelY(widget.y) + 'px';
            }
          }
        })
        .resizable({
          edges: { top:false, left:false, bottom:false, right:false },
          listeners: {
            start() { pushUndo(); },
            move(e) {
              widget.w = pixelToPercX(e.rect.width);
              widget.h = pixelToPercY(e.rect.height);
              el.style.width = percToPixelX(widget.w) + 'px';
              el.style.height = percToPixelY(widget.h) + 'px';
            }
          }
        });
      const rotHandle = el.querySelector('.rotate-handle');
      if (rotHandle) {
        interact(rotHandle).draggable({
          listeners: {
            start() { pushUndo(); },
            move(e) {
              const angle = Math.atan2(e.dy, e.dx) * (180/Math.PI);
              widget.rotation = (widget.rotation||0) + angle * 0.3;
              el.style.transform = `rotate(${widget.rotation}deg)`;
            }
          }
        });
      }
    }

    function selectWidget(id) {
      selectedId = id;
      document.querySelectorAll('.canvas-widget').forEach(el => el.classList.remove('selected'));
      const el = document.querySelector(`.canvas-widget[data-id="${id}"]`);
      if (el) el.classList.add('selected');
      const w = layout.find(w => w.id === id);
      if (!w) { noWidgetMsg.style.display='block'; settingsDiv.style.display='none'; return; }
      noWidgetMsg.style.display='none';
      settingsDiv.style.display='block';
      const typeDef = widgetTypes.find(t => t.type === w.type);
      if (!typeDef) return;
      let html = `<h4>${typeDef.name}</h4>`;
      for (const [key, val] of Object.entries(typeDef.defaults)) {
        const currentVal = w.settings?.[key] !== undefined ? w.settings[key] : val;
        if (key === 'src' || key === 'url' || key === 'audioUrl' || key === 'videoUrl') {
          html += `<div class="setting-row"><label>${key}</label><input type="file" data-key="${key}" accept="image/*,audio/*,video/*">`;
          if (currentVal) html += `<a href="${currentVal}" target="_blank">current file</a>`;
          html += `</div>`;
        } else if (typeof currentVal === 'boolean') {
          html += `<div class="setting-row"><label>${key} <input type="checkbox" data-key="${key}" ${currentVal?'checked':''}></label></div>`;
        } else if (key === 'badges') {
          html += `<div class="setting-row"><label>Badges (comma separated)</label><input type="text" data-key="${key}" value="${Array.isArray(currentVal)?currentVal.join(','):currentVal}"></div>`;
        } else {
          html += `<div class="setting-row"><label>${key}</label><input type="text" data-key="${key}" value="${currentVal}"></div>`;
        }
      }
      html += '<button class="btn" id="applySettingsBtn">Apply</button>';
      settingsDiv.innerHTML = html;
      document.getElementById('applySettingsBtn').onclick = () => applySettings(w);
    }

    function applySettings(widget) {
      const inputs = settingsDiv.querySelectorAll('input, select, textarea');
      inputs.forEach(inp => {
        const key = inp.dataset.key;
        if (!key) return;
        if (inp.type === 'file' && inp.files.length > 0) {
          const file = inp.files[0];
          const reader = new FileReader();
          reader.onload = () => {
            widget.settings[key] = reader.result;
            renderCanvas();
          };
          reader.readAsDataURL(file);
        } else if (inp.type === 'checkbox') {
          widget.settings[key] = inp.checked;
        } else if (key === 'badges') {
          widget.settings[key] = inp.value.split(',').map(s => s.trim());
        } else {
          widget.settings[key] = inp.value;
        }
      });
      renderCanvas();
    }

    function addWidget(type) {
      const def = widgetTypes.find(t => t.type === type);
      if (!def) return;
      pushUndo();
      const newWidget = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        type, x:10, y:10, w:20, h:15, rotation:0,
        settings: { ...def.defaults }
      };
      layout.push(newWidget);
      renderCanvas();
    }

    function deleteSelected() {
      if (!selectedId) return;
      pushUndo();
      layout = layout.filter(w => w.id !== selectedId);
      selectedId = null;
      renderCanvas();
      noWidgetMsg.style.display='block';
      settingsDiv.style.display='none';
    }

    function duplicateSelected() {
      if (!selectedId) return;
      const w = layout.find(w => w.id === selectedId);
      if (!w) return;
      pushUndo();
      const clone = JSON.parse(JSON.stringify(w));
      clone.id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      clone.x = Math.min(90, clone.x+2);
      clone.y = Math.min(90, clone.y+2);
      layout.push(clone);
      renderCanvas();
    }

    const templates = {
      gamer: [
        { type:'text', x:50, y:10, w:40, h:10, settings:{content:'GAMER',fontSize:24,color:'#00ff00'} },
        { type:'discord', x:5, y:25, w:30, h:30 },
        { type:'twitch', x:65, y:25, w:30, h:30 },
      ],
      artist: [
        { type:'image', x:10, y:10, w:30, h:30 },
        { type:'text', x:45, y:15, w:30, h:15, settings:{content:'My Art',fontSize:20} },
      ],
      minimal: [
        { type:'text', x:50, y:40, w:40, h:10, settings:{content:'Hello',fontSize:18,align:'center'} },
      ],
      retro: [
        { type:'marquee-text', x:10, y:5, w:80, h:8, settings:{content:'Welcome to my retro page!',speed:4} },
        { type:'divider', x:10, y:20, w:80, h:2, settings:{style:'dashed',color:'#ff00ff'} },
      ],
      neon: [
        { type:'neon-text', x:20, y:20, w:60, h:20, settings:{content:'NEON DREAMS',color:'#00ffff',fontSize:28} },
        { type:'shape', x:40, y:50, w:20, h:15, settings:{shape:'circle',color:'#ff00ff'} },
      ]
    };

    function applyTemplate(name) {
      if (!templates[name]) return;
      if (!confirm('Replace current layout with template?')) return;
      pushUndo();
      layout = templates[name].map((tpl, i) => ({
        id: Date.now()+i+Math.random(),
        ...tpl,
        rotation:0,
        settings: tpl.settings || widgetTypes.find(t=>t.type===tpl.type)?.defaults || {}
      }));
      renderCanvas();
    }

    // Populate widget sidebar
    const widgetListEl = document.getElementById('widgetList');
    widgetTypes.forEach(wt => {
      const item = document.createElement('div');
      item.className = 'widget-item';
      item.innerHTML = wt.icon + ' ' + wt.name;
      item.onclick = () => addWidget(wt.type);
      widgetListEl.appendChild(item);
    });

    // Toolbar events
    document.getElementById('saveBtn').onclick = saveLayout;
    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('redoBtn').onclick = redo;
    document.getElementById('deleteBtn').onclick = deleteSelected;
    document.getElementById('duplicateBtn').onclick = duplicateSelected;
    document.getElementById('templateSelect').onchange = (e) => { if(e.target.value) applyTemplate(e.target.value); e.target.value=''; };
    document.getElementById('snapToggle').onchange = (e) => { snapToGrid = e.target.checked; };
    document.getElementById('zoomSlider').oninput = (e) => { zoom = e.target.value/100; renderCanvas(); };
    document.getElementById('previewBtn').onclick = () => window.open(`/${user.username}`, '_blank');

    canvas.addEventListener('click', (e) => {
      if (e.target === canvas || e.target.classList.contains('canvas-area')) {
        selectedId = null;
        document.querySelectorAll('.canvas-widget').forEach(el => el.classList.remove('selected'));
        noWidgetMsg.style.display='block';
        settingsDiv.style.display='none';
      }
    });

    // Page settings modal
    document.getElementById('openPageSettings').onclick = () => document.getElementById('pageSettingsModal').style.display='flex';
    document.getElementById('savePageSettings').onclick = () => {
      const bgType = document.getElementById('bgType').value;
      const bgFile = document.getElementById('bgFile').files[0];
      const bgColor = document.getElementById('bgColor').value;
      // Convert files to base64 if needed
      const updateSettings = (key, value) => { pageSettings[key] = value; };
      updateSettings('background', { type: bgType, value: bgColor });
      if (bgFile) {
        const reader = new FileReader();
        reader.onload = () => { pageSettings.background.value = reader.result; };
        reader.readAsDataURL(bgFile);
      }
      // cursor, favicon, overlay... (same pattern)
      document.getElementById('pageSettingsModal').style.display='none';
      alert('Page settings saved. Save layout to persist.');
    };

    // Account settings
    document.getElementById('changePassBtn').onclick = async () => {
      const current = document.getElementById('currentPass').value;
      const newPass = document.getElementById('newPass').value;
      if (!current || !newPass) return alert('Fill both');
      const res = await fetch('/api/change-password', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
        body: JSON.stringify({currentPassword:current, newPassword:newPass})
      });
      if (res.ok) alert('Changed!');
      else alert('Failed');
    };
    document.getElementById('deleteAccountBtn').onclick = () => {
      if (confirm('Delete account?')) {
        fetch('/api/delete-account', { method:'DELETE', headers:{'Authorization':`Bearer ${token}`} })
          .then(() => { localStorage.clear(); window.location.href = '/'; });
      }
    };

    loadLayout();
  })();
</script>
</body>
</html>
