<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromaticc — The bio site, reworked.</title>
<meta name="description" content="Claim your handle. Build your canvas. The ultimate minimal link-in-bio platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ── 1. THEME VARIABLES ── */
:root {
  --bg: #050505;
  --text: #ffffff;
  --muted: #888888;
  --border: rgba(255, 255, 255, 0.15);
  --glass: rgba(10, 10, 10, 0.6);
  --btn-bg: #ffffff;
  --btn-text: #000000;
}

[data-theme="light"] {
  --bg: #fafafa;
  --text: #050505;
  --muted: #666666;
  --border: rgba(0, 0, 0, 0.1);
  --glass: rgba(255, 255, 255, 0.7);
  --btn-bg: #050505;
  --btn-text: #ffffff;
}

/* ── 2. RESET & BASE ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden; 
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.5s, color 0.5s;
  -webkit-font-smoothing: antialiased;
}

/* ── 3. THE CANVAS BACKGROUND ── */
#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0; 
  pointer-events: none; 
}

/* ── 4. NAVIGATION ── */
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 40px; 
  position: relative;
  z-index: 10;
}
.logo { 
  font-weight: 900; font-size: 20px; letter-spacing: -1px;
  display: flex; align-items: center; gap: 8px;
}
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
.theme-toggle {
  background: transparent; border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 30px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 8px;
  backdrop-filter: blur(10px);
}
.theme-toggle:hover { background: var(--border); }

/* ── 5. HERO / MAIN CONTENT ── */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 0 20px;
  position: relative;
  z-index: 10;
  pointer-events: none; 
}
.hero > * { pointer-events: auto; } 

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 6px 12px; border-radius: 20px;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(10px); margin-bottom: 24px;
  color: var(--muted); font-weight: 600; letter-spacing: 0.5px;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

h1.hero-title {
  font-size: clamp(60px, 10vw, 140px);
  font-weight: 900; letter-spacing: -0.06em; line-height: 0.95;
  margin-bottom: 24px;
}
.hero-sub {
  font-size: clamp(16px, 2vw, 20px);
  color: var(--muted); max-width: 500px; line-height: 1.5;
  margin-bottom: 48px;
}

/* ── 6. CLAIM INPUT ── */
.claim-wrap { width: 100%; max-width: 520px; }
.claim-box {
  display: flex; align-items: center;
  background: var(--glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 8px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}
.claim-box:focus-within {
  border-color: var(--text);
  transform: translateY(-2px);
  box-shadow: 0 24px 48px rgba(0,0,0,0.2);
}
.claim-prefix {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; color: var(--muted); user-select: none;
  padding-left: 16px;
}
#claimInput {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 15px; outline: none; padding: 12px 8px;
}
#claimInput::placeholder { color: var(--muted); opacity: 0.5; }

#claimBtn {
  background: var(--btn-bg); color: var(--btn-text);
  border: none; padding: 12px 24px; border-radius: 10px;
  font-weight: 700; font-size: 14px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
#claimBtn:disabled { opacity: 0.3; cursor: not-allowed; }
#claimBtn:not(:disabled):hover { transform: scale(1.02); }

.claim-status {
  height: 24px; margin-top: 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
  display: flex; justify-content: center; align-items: center;
}
.valid { color: #10b981; }
.invalid { color: #ef4444; }
</style>
</head>
<body>

<!-- The Background -->
<canvas id="bgCanvas"></canvas>

<!-- Nav -->
<nav>
  <div class="logo"><div class="logo-dot"></div>Chromaticc.</div>
  <button class="theme-toggle" id="themeToggle">
    <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <span id="themeText">Dark</span>
  </button>
</nav>

<!-- Hero -->
<main class="hero">
  <div class="badge">
    <div class="badge-dot"></div> v1.0 BETA
  </div>
  
  <h1 class="hero-title">Your page.<br>Your rules.</h1>
  
  <p class="hero-sub">Claim your handle and build a site that actually looks good. No templates. No limits.</p>

  <div class="claim-wrap">
    <div class="claim-box">
      <span class="claim-prefix">chromati.cc.cd/</span>
      <input type="text" id="claimInput" placeholder="username" autocomplete="off" spellcheck="false">
      <button id="claimBtn" disabled>Claim</button>
    </div>
    <div id="claimStatus" class="claim-status"></div>
  </div>
</main>

<script>
/* ── 1. THEME SETUP ── */
// Theme variables for the canvas
let theme = {
  dotColor: 'rgba(255, 255, 255, 0.25)',
  activeColor: 'rgba(255, 255, 255, 1)',
  bgColor: '#050505'
};

const root = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const themeText = document.getElementById('themeText');
const themeIcon = document.getElementById('themeIcon');

const savedTheme = localStorage.getItem('theme') || 'dark';
root.setAttribute('data-theme', savedTheme);
updateThemeUI(savedTheme);

toggleBtn.addEventListener('click', () => {
  const current = root.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeUI(next);
});

function updateThemeUI(mode) {
  if (mode === 'light') {
    themeText.textContent = 'Light';
    themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>';
    theme = {
      dotColor: 'rgba(0, 0, 0, 0.15)',
      activeColor: 'rgba(0, 0, 0, 0.8)',
      bgColor: '#fafafa'
    };
  } else {
    themeText.textContent = 'Dark';
    themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    theme = {
      dotColor: 'rgba(255, 255, 255, 0.15)',
      activeColor: 'rgba(255, 255, 255, 0.9)',
      bgColor: '#050505'
    };
  }
}

/* ── 2. THE MAGNETIC DOT MATRIX ── */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let width, height;
let dots = [];
let mouse = { x: -1000, y: -1000, active: false };

const spacing = 30; // Space between dots
const baseRadius = 1.5; // Tiny dots
const interactionRadius = 120; // How far the mouse pushes them

function initCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  
  dots = [];
  const cols = Math.ceil(width / spacing) + 1;
  const rows = Math.ceil(height / spacing) + 1;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      dots.push({
        baseX: x * spacing,
        baseY: y * spacing,
        x: x * spacing,
        y: y * spacing,
        vx: 0,
        vy: 0
      });
    }
  }
}

window.addEventListener('resize', initCanvas);
window.addEventListener('mousemove', (e) => { 
  mouse.x = e.clientX; 
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => { 
  mouse.x = -1000; 
  mouse.y = -1000; 
  mouse.active = false;
});

function animate() {
  requestAnimationFrame(animate);
  
  // Clear with the theme background color
  ctx.fillStyle = theme.bgColor;
  ctx.fillRect(0, 0, width, height);

  // Draw a massive, soft spotlight behind everything
  if (mouse.active) {
    const gradient = ctx.createRadialGradient(
      mouse.x, mouse.y, 0,
      mouse.x, mouse.y, 600
    );
    // Very subtle glow
    gradient.addColorStop(0, root.getAttribute('data-theme') === 'dark' ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.02)');
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }

  ctx.fillStyle = theme.dotColor;

  for (let i = 0; i < dots.length; i++) {
    let d = dots[i];
    
    // Calculate distance to mouse
    let dx = mouse.x - d.baseX;
    let dy = mouse.y - d.baseY;
    let dist = Math.sqrt(dx * dx + dy * dy);

    let targetX = d.baseX;
    let targetY = d.baseY;
    let size = baseRadius;
    let isNearMouse = false;

    if (mouse.active && dist < interactionRadius) {
      isNearMouse = true;
      // Push the dot away from the mouse
      let force = (interactionRadius - dist) / interactionRadius;
      let push = force * 25; // How hard it pushes
      
      targetX -= (dx / dist) * push;
      targetY -= (dy / dist) * push;
      
      // Make the dot slightly bigger near the mouse
      size += force * 2;
    }

    // Smooth spring physics (lerp)
    d.x += (targetX - d.x) * 0.15;
    d.y += (targetY - d.y) * 0.15;

    // Draw the dot
    ctx.fillStyle = isNearMouse ? theme.activeColor : theme.dotColor;
    ctx.beginPath();
    ctx.arc(d.x, d.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

initCanvas();
animate();

/* ── 3. CLAIM FLOW ── */
const input = document.getElementById('claimInput');
const status = document.getElementById('claimStatus');
const btn = document.getElementById('claimBtn');
let debounceTimer;

input.addEventListener('input', (e) => {
  const val = e.target.value.toLowerCase().trim();
  btn.disabled = true;
  status.textContent = '';
  status.className = 'claim-status';

  if (val.length === 0) return;
  
  if (val.length < 3) {
    status.textContent = 'Too short (min 3 chars)';
    status.classList.add('invalid');
    return;
  }

  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async () => {
    status.textContent = 'Checking availability...';
    status.style.color = 'var(--muted)';
    
    try {
      await new Promise(r => setTimeout(r, 600)); 
      const isTaken = ['admin', 'chrx', 'login', 'test'].includes(val);
      
      if (!isTaken) {
        status.textContent = '✓ Handle is available';
        status.className = 'claim-status valid';
        btn.disabled = false;
      } else {
        status.textContent = '✗ Handle is already taken';
        status.className = 'claim-status invalid';
      }
    } catch (err) {
      status.textContent = 'Error checking handle';
      status.classList.add('invalid');
    }
  }, 500);
});

btn.addEventListener('click', () => {
  const val = input.value.toLowerCase().trim();
  if (val) window.location.href = `/accounts.html?claim=${val}`;
});
</script>
</body>
</html>
