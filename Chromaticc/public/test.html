<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromaticc — The bio site, reworked.</title>
<meta name="description" content="Claim your handle. Build your canvas. The ultimate minimal link-in-bio platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ── 1. THEME VARIABLES ── */
:root {
  --bg: #050505;
  --text: #ffffff;
  --muted: #888888;
  --border: rgba(255, 255, 255, 0.15);
  --glass: rgba(10, 10, 10, 0.6);
  --btn-bg: #ffffff;
  --btn-text: #000000;
}

[data-theme="light"] {
  --bg: #fafafa;
  --text: #050505;
  --muted: #666666;
  --border: rgba(0, 0, 0, 0.1);
  --glass: rgba(255, 255, 255, 0.7);
  --btn-bg: #050505;
  --btn-text: #ffffff;
}

/* ── 2. RESET & BASE ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden; 
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.5s, color 0.5s;
  -webkit-font-smoothing: antialiased;
}

/* ── 3. THE CANVAS BACKGROUND ── */
#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0; 
  pointer-events: none; 
  /* Fade out the edges so it looks like it goes on forever */
  -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
  mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
}

/* ── 4. NAVIGATION ── */
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 40px; 
  position: relative;
  z-index: 10;
}
.logo { 
  font-weight: 900; font-size: 20px; letter-spacing: -1px;
  display: flex; align-items: center; gap: 8px;
}
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
.theme-toggle {
  background: transparent; border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 30px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 8px;
}
.theme-toggle:hover { background: var(--border); }

/* ── 5. HERO / MAIN CONTENT ── */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 0 20px;
  position: relative;
  z-index: 10;
  pointer-events: none; 
}
.hero > * { pointer-events: auto; } 

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 6px 12px; border-radius: 20px;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(10px); margin-bottom: 24px;
  color: var(--muted); font-weight: 600; letter-spacing: 0.5px;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

h1.hero-title {
  font-size: clamp(60px, 10vw, 140px);
  font-weight: 900; letter-spacing: -0.06em; line-height: 0.95;
  margin-bottom: 24px;
}
.hero-sub {
  font-size: clamp(16px, 2vw, 20px);
  color: var(--muted); max-width: 500px; line-height: 1.5;
  margin-bottom: 48px;
}

/* ── 6. CLAIM INPUT ── */
.claim-wrap { width: 100%; max-width: 520px; }
.claim-box {
  display: flex; align-items: center;
  background: var(--glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 8px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}
.claim-box:focus-within {
  border-color: var(--text);
  transform: translateY(-2px);
  box-shadow: 0 24px 48px rgba(0,0,0,0.2);
}
.claim-prefix {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; color: var(--muted); user-select: none;
  padding-left: 16px;
}
#claimInput {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 15px; outline: none; padding: 12px 8px;
}
#claimInput::placeholder { color: var(--muted); opacity: 0.5; }

#claimBtn {
  background: var(--btn-bg); color: var(--btn-text);
  border: none; padding: 12px 24px; border-radius: 10px;
  font-weight: 700; font-size: 14px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
#claimBtn:disabled { opacity: 0.3; cursor: not-allowed; }
#claimBtn:not(:disabled):hover { transform: scale(1.02); }

.claim-status {
  height: 24px; margin-top: 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
  display: flex; justify-content: center; align-items: center;
}
.valid { color: #10b981; }
.invalid { color: #ef4444; }
</style>
</head>
<body>

<!-- The Background -->
<canvas id="bgCanvas"></canvas>

<!-- Nav -->
<nav>
  <div class="logo"><div class="logo-dot"></div>Chromaticc.</div>
  <button class="theme-toggle" id="themeToggle">
    <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <span id="themeText">Dark</span>
  </button>
</nav>

<!-- Hero -->
<main class="hero">
  <div class="badge">
    <div class="badge-dot"></div> v1.0 BETA
  </div>
  
  <h1 class="hero-title">Your page.<br>Your rules.</h1>
  
  <p class="hero-sub">Claim your handle and build a site that actually looks good. No templates. No limits.</p>

  <div class="claim-wrap">
    <div class="claim-box">
      <span class="claim-prefix">chromati.cc.cd/</span>
      <input type="text" id="claimInput" placeholder="username" autocomplete="off" spellcheck="false">
      <button id="claimBtn" disabled>Claim</button>
    </div>
    <div id="claimStatus" class="claim-status"></div>
  </div>
</main>

<script>
/* ── 1. THEME SETUP ── */
// Brighter colors so they actually show up
let canvasColors = { line: 'rgba(255,255,255,0.2)', node: 'rgba(255,255,255,0.7)', glow: 'rgba(255,255,255,0.08)' };

const root = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const themeText = document.getElementById('themeText');
const themeIcon = document.getElementById('themeIcon');

const savedTheme = localStorage.getItem('theme') || 'dark';
root.setAttribute('data-theme', savedTheme);
updateThemeUI(savedTheme);

toggleBtn.addEventListener('click', () => {
  const current = root.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeUI(next);
});

function updateThemeUI(theme) {
  if (theme === 'light') {
    themeText.textContent = 'Light';
    themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>';
    canvasColors = { line: 'rgba(0,0,0,0.15)', node: 'rgba(0,0,0,0.5)', glow: 'rgba(0,0,0,0.04)' };
  } else {
    themeText.textContent = 'Dark';
    themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    canvasColors = { line: 'rgba(255,255,255,0.2)', node: 'rgba(255,255,255,0.7)', glow: 'rgba(255,255,255,0.08)' };
  }
}

/* ── 2. 3D INFINITE TUNNEL BACKGROUND ── */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let width, height;
let mouse = { targetX: -1000, targetY: -1000, active: false };

// Tunnel Config
const FOV = 800;
const SPEED = 3;
const RINGS = 8;
const POINTS_PER_RING = 50;
const RADIUS = 600;

let points = [];

function initCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  
  points = [];
  for (let r = 0; r < RINGS; r++) {
    for (let i = 0; i < POINTS_PER_RING; i++) {
      const angle = (i / POINTS_PER_RING) * Math.PI * 2;
      // Add a slight wave to the radius so it's not a perfect circle
      const rRadius = RADIUS + Math.sin(angle * 3) * 100 + Math.cos(angle * 5) * 50;
      
      points.push({
        x: Math.cos(angle) * rRadius,
        y: Math.sin(angle) * rRadius,
        z: r * 400,
        ox: Math.cos(angle) * rRadius,
        oy: Math.sin(angle) * rRadius,
        ring: r,
        idx: i
      });
    }
  }
}

window.addEventListener('resize', initCanvas);
window.addEventListener('mousemove', (e) => { 
  mouse.targetX = e.clientX; 
  mouse.targetY = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => { 
  mouse.targetX = -1000; 
  mouse.targetY = -1000; 
  mouse.active = false;
});

function project(p) {
  const scale = FOV / (p.z + 800);
  // Parallax shift based on mouse position
  let mx = mouse.active ? (mouse.targetX - width / 2) * 0.15 : 0;
  let my = mouse.active ? (mouse.targetY - height / 2) * 0.15 : 0;

  return {
    x: width / 2 + (p.x - mx) * scale,
    y: height / 2 + (p.y - my) * scale,
    scale: scale,
    z: p.z
  };
}

function animateMesh() {
  requestAnimationFrame(animateMesh);
  ctx.clearRect(0, 0, width, height);

  // 1. Update Points
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    p.z -= SPEED;
    
    // Wrap points back to the end of the tunnel
    if (p.z < -400) {
      p.z += RINGS * 400;
    }

    // Mouse repulsion (3D effect)
    const proj = project(p);
    let dx = mouse.targetX - proj.x;
    let dy = mouse.targetY - proj.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    
    if (mouse.active && dist < 400) {
      let force = (400 - dist) / 400;
      p.x -= (dx / Math.max(1, dist)) * force * 30;
      p.y -= (dy / Math.max(1, dist)) * force * 30;
    } else {
      p.x += (p.ox - p.x) * 0.05;
      p.y += (p.oy - p.y) * 0.05;
    }
  }

  // 2. Draw Lines
  ctx.strokeStyle = canvasColors.line;
  ctx.lineWidth = 1;

  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let projP = project(p);
    
    // Fade out as they get further away
    let alpha = Math.max(0, 1 - (p.z / (RINGS * 400)));
    alpha = Math.min(1, alpha);
    if (alpha <= 0.01) continue;

    // Connect to next point in the ring
    let nextIdx = (p.idx + 1) % POINTS_PER_RING;
    let next = points[p.ring * POINTS_PER_RING + nextIdx];
    let projN = project(next);
    
    ctx.globalAlpha = alpha * 0.4;
    ctx.beginPath();
    ctx.moveTo(projP.x, projP.y);
    ctx.lineTo(projN.x, projN.y);
    ctx.stroke();

    // Connect to the point in the next ring forward
    if (p.ring < RINGS - 1) {
      let front = points[(p.ring + 1) * POINTS_PER_RING + p.idx];
      let projF = project(front);
      
      ctx.globalAlpha = alpha * 0.4;
      ctx.beginPath();
      ctx.moveTo(projP.x, projP.y);
      ctx.lineTo(projF.x, projF.y);
      ctx.stroke();
    }
  }

  // 3. Draw Nodes
  ctx.fillStyle = canvasColors.node;
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let proj = project(p);
    
    let alpha = Math.max(0, 1 - (p.z / (RINGS * 400)));
    alpha = Math.min(1, alpha);
    if (alpha <= 0.01) continue;

    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, Math.max(1, 2.5 * proj.scale), 0, Math.PI * 2);
    ctx.fill();
  }

  // 4. Cursor Spotlight
  if (mouse.active) {
    const gradient = ctx.createRadialGradient(
      mouse.targetX, mouse.targetY, 0,
      mouse.targetX, mouse.targetY, 500
    );
    gradient.addColorStop(0, canvasColors.glow);
    gradient.addColorStop(1, 'transparent');
    
    ctx.fillStyle = gradient;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 0, width, height);
  }

  ctx.globalAlpha = 1;
}

initCanvas();
animateMesh();

/* ── 3. CLAIM FLOW ── */
const input = document.getElementById('claimInput');
const status = document.getElementById('claimStatus');
const btn = document.getElementById('claimBtn');
let debounceTimer;

input.addEventListener('input', (e) => {
  const val = e.target.value.toLowerCase().trim();
  btn.disabled = true;
  status.textContent = '';
  status.className = 'claim-status';

  if (val.length === 0) return;
  
  if (val.length < 3) {
    status.textContent = 'Too short (min 3 chars)';
    status.classList.add('invalid');
    return;
  }

  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async () => {
    status.textContent = 'Checking availability...';
    status.style.color = 'var(--muted)';
    
    try {
      await new Promise(r => setTimeout(r, 600)); 
      const isTaken = ['admin', 'chrx', 'login', 'test'].includes(val);
      
      if (!isTaken) {
        status.textContent = '✓ Handle is available';
        status.className = 'claim-status valid';
        btn.disabled = false;
      } else {
        status.textContent = '✗ Handle is already taken';
        status.className = 'claim-status invalid';
      }
    } catch (err) {
      status.textContent = 'Error checking handle';
      status.classList.add('invalid');
    }
  }, 500);
});

btn.addEventListener('click', () => {
  const val = input.value.toLowerCase().trim();
  if (val) window.location.href = `/accounts.html?claim=${val}`;
});
</script>
</body>
</html>
