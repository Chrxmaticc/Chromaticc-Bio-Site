<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromaticc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ── 1. THE THEME VARIABLES (Light & Dark) ── */
:root {
  /* Default: Dark Mode */
  --bg: #000000;
  --text: #ffffff;
  --muted: #888888;
  --border: rgba(255, 255, 255, 0.15);
  --glass: rgba(0, 0, 0, 0.6);
  --btn-bg: #ffffff;
  --btn-text: #000000;
  --orb-1: rgba(255, 255, 255, 0.1);
  --orb-2: rgba(100, 100, 255, 0.1);
  --orb-3: rgba(255, 255, 255, 0.05);
}

[data-theme="light"] {
  --bg: #ffffff;
  --text: #000000;
  --muted: #666666;
  --border: rgba(0, 0, 0, 0.1);
  --glass: rgba(255, 255, 255, 0.6);
  --btn-bg: #000000;
  --btn-text: #ffffff;
  --orb-1: rgba(0, 0, 0, 0.05);
  --orb-2: rgba(255, 100, 200, 0.15);
  --orb-3: rgba(100, 200, 255, 0.1);
}

/* ── 2. BASE STYLES ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  transition: background-color 0.5s, color 0.5s;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── 3. THE FLUID BACKGROUND (wsp.baby style) ── */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  z-index: -1;
  transition: background 0.5s;
}
.orb-1 {
  width: 60vw; height: 60vw;
  background: var(--orb-1);
  top: -20%; left: -10%;
  animation: float 20s ease-in-out infinite alternate;
}
.orb-2 {
  width: 50vw; height: 50vw;
  background: var(--orb-2);
  bottom: -20%; right: -10%;
  animation: float 25s ease-in-out infinite alternate-reverse;
}
.orb-3 {
  width: 40vw; height: 40vw;
  background: var(--orb-3);
  top: 40%; left: 30%;
  animation: float 30s ease-in-out infinite alternate;
}
@keyframes float {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(10%, 15%) scale(1.1); }
}

/* ── 4. NAVIGATION ── */
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 40px; z-index: 10;
}
.logo { font-weight: 900; font-size: 20px; letter-spacing: -1px; }
.theme-toggle {
  background: transparent; border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 30px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  cursor: pointer; transition: all 0.3s;
}
.theme-toggle:hover { background: var(--border); }

/* ── 5. THE HERO (Minimal Showcase) ── */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 0 20px; margin-top: -60px;
}
.hero h1 {
  font-size: clamp(60px, 10vw, 140px);
  font-weight: 900; letter-spacing: -0.05em; line-height: 0.9;
  margin-bottom: 24px;
}
.hero p {
  font-size: clamp(18px, 2vw, 24px);
  color: var(--muted); max-width: 600px; line-height: 1.4;
  margin-bottom: 48px;
}

/* ── 6. THE CLAIM INPUT (wsp.baby style) ── */
.claim-box {
  display: flex; align-items: center;
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 10px 10px 10px 24px;
  width: 100%; max-width: 500px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  transition: all 0.3s;
}
.claim-box:focus-within {
  border-color: var(--text); transform: translateY(-2px);
}
.claim-prefix {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; color: var(--muted); user-select: none;
}
#claimInput {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 16px; outline: none; padding-left: 4px;
}
#claimInput::placeholder { color: var(--muted); opacity: 0.5; }

#claimBtn {
  background: var(--btn-bg); color: var(--btn-text);
  border: none; padding: 14px 24px; border-radius: 12px;
  font-weight: 800; font-size: 14px; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
#claimBtn:disabled { opacity: 0.3; cursor: not-allowed; }
#claimBtn:not(:disabled):hover { opacity: 0.8; }

.claim-status {
  height: 20px; margin-top: 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
}
.valid { color: #10b981; }
.invalid { color: #ef4444; }

/* Light mode adjustments for the input */
[data-theme="light"] .claim-box { box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
</style>
</head>
<body>

<!-- The Moving Background -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<!-- Nav -->
<nav>
  <div class="logo">Chromaticc.</div>
  <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
</nav>

<!-- Hero -->
<main class="hero">
  <h1>Your page.<br>Your rules.</h1>
  <p>The bio site, reworked. Claim your handle before it's gone.</p>

  <div class="claim-box">
    <span class="claim-prefix">chromati.cc.cd/</span>
    <input type="text" id="claimInput" placeholder="chrx" autocomplete="off" spellcheck="false">
    <button id="claimBtn" disabled>Claim</button>
  </div>
  <div id="claimStatus" class="claim-status"></div>
</main>

<script>
// 1. LIGHT / DARK MODE TOGGLE
const root = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('theme') || 'dark';
root.setAttribute('data-theme', savedTheme);

toggleBtn.addEventListener('click', () => {
  const current = root.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

// 2. THE CLAIM FLOW (Live Check)
const input = document.getElementById('claimInput');
const status = document.getElementById('claimStatus');
const btn = document.getElementById('claimBtn');
let debounceTimer;

input.addEventListener('input', (e) => {
  const val = e.target.value.toLowerCase().trim();
  
  btn.disabled = true;
  status.textContent = '';
  status.className = 'claim-status';

  if (val.length === 0) return;
  
  if (val.length < 3) {
    status.textContent = 'Min 3 characters.';
    status.classList.add('invalid');
    return;
  }

  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async () => {
    status.textContent = 'Checking...';
    
    try {
      // This hits the Node.js API we wrote earlier
      const res = await fetch(`/api/check-username?username=${val}`);
      const data = await res.json();
      
      if (data.available) {
        status.textContent = '✓ Available!';
        status.className = 'claim-status valid';
        btn.disabled = false;
      } else {
        status.textContent = `✗ ${data.reason}`;
        status.className = 'claim-status invalid';
      }
    } catch (err) {
      status.textContent = 'Error checking.';
      status.classList.add('invalid');
    }
  }, 500);
});

btn.addEventListener('click', () => {
  const val = input.value.toLowerCase().trim();
  if (val) window.location.href = `/accounts.html?claim=${val}`;
});
</script>
</body>
</html>
