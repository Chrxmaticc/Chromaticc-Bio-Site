<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chromati.cc.cd</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #050505; /* Change to #ffffff for light mode */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ── LOGO (Top Left) ── */
        .logo {
            position: absolute;
            top: 32px;
            left: 32px;
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 12px;
            /* Adds a subtle fallback color if the image fails to load */
            background-color: #121212; 
            z-index: 10;
        }

        /* ── MAIN LAYOUT (Centers the box) ── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1;
        }

        /* ── CLAIM CONTAINER ── */
        .claim-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 600px;
        }

        /* ── INPUT ── */
        .claim-input {
            width: 100%;
            background: #121212;
            border: 1px solid #27272a;
            color: #ffffff;
            font-size: clamp(20px, 4vw, 28px);
            padding: 24px 32px;
            border-radius: 20px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .claim-input::placeholder {
            color: #52525b;
        }

        .claim-input:focus {
            border-color: #52525b;
            background: #18181b;
        }

        /* ── BUTTON ── */
        .claim-button {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            font-size: clamp(20px, 4vw, 24px);
            font-weight: 600;
            padding: 24px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            transition: transform 0.15s ease, background 0.2s;
        }

        .claim-button:hover {
            background: #e4e4e7;
        }

        .claim-button:active {
            transform: scale(0.98);
        }

        .claim-button span {
            font-size: clamp(20px, 4vw, 24px);
            font-weight: 400;
            margin-top: -2px;
        }

        /* ── MOBILE ADJUSTMENTS ── */
        @media (max-width: 600px) {
            .logo {
                top: 24px;
                left: 24px;
                width: 40px;
                height: 40px;
            }
            .claim-input, .claim-button {
                padding: 18px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Replace "logo.png" with your actual image path -->
    <img src="logo.png" alt="Logo" class="logo">

    <main>
        <div class="claim-container">
            <input type="text" id="username" class="claim-input" placeholder="chromati.cc.cd/you" autocomplete="off" spellcheck="false" />
            
            <button class="claim-button" onclick="claimHandle()">
                Claim <span>→</span>
            </button>
        </div>
    </main>

    <script>
        function claimHandle() {
            const input = document.getElementById('username');
            let val = input.value.trim().toLowerCase();
            
            // Strip the prefix if they accidentally typed it
            val = val.replace('chromati.cc.cd/', '');

            if (!val) {
                input.focus();
                return;
            }

            // Simple regex to ensure URL safety
            if (!/^[a-z0-9-]+$/.test(val)) {
                alert("Please use only lowercase letters, numbers, and hyphens.");
                return;
            }

            // Route to signup with the handle pre-filled
            window.location.href = `/signup?handle=${val}`;
        }

        // Allow pressing Enter to submit
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') claimHandle();
        });
    </script>
</body>
</html>
