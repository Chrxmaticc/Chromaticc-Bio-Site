<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chromati.cc.cd — your page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── RESET & CORE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #050505;
            color: #f5f5f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* No scrolling, pure focus */
            position: relative;
        }

        /* ── SUBTLE BACKGROUND GLOW ── */
        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* ── LAYOUT ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 1;
        }

        /* ── TYPOGRAPHY ── */
        h1 {
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 600;
            letter-spacing: -0.05em; /* Tight tracking for that premium look */
            line-height: 1.05;
            max-width: 800px;
            margin-bottom: 24px;
        }

        p.subtitle {
            font-size: clamp(16px, 2vw, 20px);
            color: #a1a1aa;
            max-width: 480px;
            line-height: 1.5;
            font-weight: 400;
            margin-bottom: 48px;
        }

        /* ── CLAIM INPUT ── */
        .claim-box {
            display: flex;
            align-items: center;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 6px;
            width: 100%;
            max-width: 440px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .claim-box:focus-within {
            border-color: #52525b;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        .prefix {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #71717a;
            padding-left: 12px;
            white-space: nowrap;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f5f5f5;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            padding: 12px;
            min-width: 0;
        }

        input[type="text"]::placeholder {
            color: #3f3f46;
        }

        button {
            background: #ffffff;
            color: #050505;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s;
        }

        button:hover {
            background: #e4e4e7;
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        /* ── FOOTER ── */
        footer {
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: #52525b;
            font-weight: 500;
            z-index: 1;
        }

        footer a {
            color: #a1a1aa;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #f5f5f5;
        }

        /* ── MOBILE OPTIMIZATIONS ── */
        @media (max-width: 500px) {
            .claim-box {
                flex-direction: column;
                padding: 12px;
                gap: 12px;
            }
            .prefix {
                padding-left: 0;
                width: 100%;
                text-align: left;
                font-size: 12px;
            }
            input[type="text"] {
                width: 100%;
                text-align: left;
                padding: 8px 0;
            }
            button {
                width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <main>
        <h1>Your entire internet.<br>One clean link.</h1>
        <p class="subtitle">No clutter. No banners. Just your identity, beautifully organized and completely yours.</p>

        <div class="claim-box">
            <span class="prefix">chromati.cc.cd/</span>
            <input type="text" id="username" placeholder="yourname" autocomplete="off" spellcheck="false">
            <button onclick="claimHandle()">Claim</button>
        </div>
    </main>

    <footer>
        © 2026 Chromaticc • <a href="/login">Login</a>
    </footer>

    <script>
        function claimHandle() {
            const input = document.getElementById('username');
            const val = input.value.trim().toLowerCase();
            
            if (!val) {
                input.focus();
                return;
            }

            // Simple regex to ensure URL safety
            if (!/^[a-z0-9-]+$/.test(val)) {
                alert("Please use only lowercase letters, numbers, and hyphens.");
                return;
            }

            // Route to signup with the handle pre-filled
            window.location.href = `/signup?handle=${val}`;
        }

        // Allow pressing Enter
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') claimHandle();
        });
    </script>
</body>
</html>
